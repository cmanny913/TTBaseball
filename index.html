// ---------- ELIGIBILITY ----------
const IF_SPOTS = ['1B', '2B', 'SS', '3B'];
const OF_SPOTS = ['LF', 'CF', 'RF'];
const ALL_SPOTS = ['C', '1B', '2B', 'SS', '3B', 'LF', 'CF', 'RF'];
// returns: 'ok' (no penalty), 'pen' (-1 DEF), or null (cannot play there)
// 'ok'  = natural position, no penalty
// 'bkp' = listed backup position, -1 DEF
// 'pen' = fully out of position, -2 DEF
// null  = illegal (only the catcher spot is truly restricted)
function eligibility(p, spot) {
  if (p.type !== 'B') return null;
  if (spot === 'DH') return 'ok';                       // anyone can DH
  if (spot === 'C') {                                   // catcher is a hard restriction
    if (p.pos === 'C') return 'ok';
    if (p.pos2 === 'C') return 'bkp';
    return null;
  }
  if (p.pos === spot) return 'ok';
  if (p.pos === 'UT' && IF_SPOTS.includes(spot)) return 'ok';          // UT: any infield, free
  if (p.pos === 'CF' && OF_SPOTS.includes(spot)) return 'ok';          // CF: any outfield, free
  if (p.pos === 'CO' && (spot === 'LF' || spot === 'RF')) return 'ok'; // CO: corners, free
  if (p.pos2) {                                                        // listed backup
    if (p.pos2 === spot) return 'bkp';
    if (p.pos2 === 'UT' && IF_SPOTS.includes(spot)) return 'bkp';
    if (p.pos2 === 'CF' && OF_SPOTS.includes(spot)) return 'bkp';
    if (p.pos2 === 'CO' && (spot === 'LF' || spot === 'RF')) return 'bkp';
  }
  return 'pen';                                                        // DH-only lands here too: -2
}
function effDefAt(p, spot) {
  const e = eligibility(p, spot);
  if (e === 'ok') return p.def;
  if (e === 'bkp') return p.def - 1;   // backup position: -1 (can go negative)
  return p.def - 2;                    // fully out of position: -2 (can go negative)
}


// ---------- TWO-WAY PLAYERS ----------

// (id + '_P') so batting and pitching stats/fatigue never collide.
const TW_THROWS = { 'B. Ruth': 'L', 'S. Ohtani': 'R' };
const TWOWAY_ARM = {};    // batterId -> armId
DB.filter(p => p.twP).forEach(p => {
  const arm = {
    id: p.id + '_P', type: 'SP', name: p.name, team: p.team, stars: p.stars,
    throws: TW_THROWS[p.name] || 'R',
    pow: clampStat(p.twP[0]), ctl: clampStat(p.twP[1]), chg: clampStat(p.twP[2]),
    twoWayOf: p.id,          // points back at the bat
  };
  byId[arm.id] = arm;
  TWOWAY_ARM[p.id] = arm.id;
});
// the arm ids a roster can start (real SPs + any two-way bat's arm)
function rosterArms(ids) {
  const sps = ids.filter(id => byId[id] && byId[id].type === 'SP');
  const tw = ids.filter(id => byId[id] && byId[id].type === 'B' && byId[id].twP)
                .map(id => TWOWAY_ARM[id]).filter(Boolean);
  return [...sps, ...tw];
}

// ---------- CLICK SYSTEM ----------
// Batters: heat -4..+4; each step shifts ONE stat, cycling from the
// player's best hitting stat. Up = +1 each step, down = -1 each step.
function batStatOrder(p) {
  const arr = [['pow', p.pow], ['con', p.con], ['onb', p.onb]];
  arr.sort((a, b) => b[1] - a[1]); // tie-break: pow > con > onb via stable sort order
  return arr.map(x => x[0]);
}
function batEff(p, heat) {
  // dial -4..+4; each step shifts one stat cycling best->2nd->3rd (so +4 = +2/+1/+1)
  const c = Math.max(-4, Math.min(4, heat || 0));
  const out = { pow: p.pow, con: p.con, onb: p.onb };
  if (c !== 0) {
    const order = batStatOrder(p);
    const sign = c > 0 ? 1 : -1;
    for (let i = 0; i < Math.abs(c); i++) out[order[i % 3]] += sign;
  }
  out.pow = Math.max(1, out.pow); out.con = Math.max(1, out.con); out.onb = Math.max(1, out.onb);
  return out;
}
// Which stat moves at a given heat step (for UI display)
function batHeatDesc(p, heat) {
  if (!heat) return 'baseline';
  const order = batStatOrder(p);
  const parts = { pow: 0, con: 0, onb: 0 };
  const sign = heat > 0 ? 1 : -1;
  for (let i = 0; i < Math.abs(heat); i++) parts[order[i % 3]] += sign;
  return Object.entries(parts).filter(([, v]) => v !== 0)
    .map(([k, v]) => `${k.toUpperCase()} ${v > 0 ? '+' : ''}${v}`).join(' ');
}
// Pitchers: SP fatigue ladder 0-4 (4 = must be substituted).
// SP: step2 -SPN; step3 -POW (+CHG if steep); step4 -CHG (or 2nd SPN if steep); step5 all.
// RP: step1 -SPN; step2 -POW; step3 -CHG, then holds.
function pitEff(p, fatigue) {
  const c = fatigue || 0;
  const out = { pow: p.pow, ctl: p.ctl, chg: p.chg };
  // 0★, 1★ and 3★ arms wear out harder: their 3rd step costs power AND change, and their 4th costs
  // a second spin step (rather than the change they've already lost).
  const steep = (p.stars === 0 || p.stars === 1 || p.stars === 3);
  if (p.type === 'RP') {
    // relievers lose one stat per step: 1=spin, 2=power, 3=change — then hold there (no lower).
    if (c >= 1) out.ctl -= 1;
    if (c >= 2) out.pow -= 1;
    if (c >= 3) out.chg -= 1;
  } else {
    // starters lose: 2=spin, 3=power (+change if steep), 4=change (or a 2nd spin if steep).
    if (c >= 2) out.ctl -= 1;
    if (c >= 3) { out.pow -= 1; if (steep) out.chg -= 1; }
    if (c >= 4) { if (steep) out.ctl -= 1; else out.chg -= 1; }
    if (c >= 5) { out.pow -= 1; out.ctl -= 1; out.chg -= 1; }   // past the line — must be relieved
  }
  out.pow = Math.max(1, out.pow); out.ctl = Math.max(1, out.ctl); out.chg = Math.max(1, out.chg);
  return out;
}

// ---------- SPRAY ----------
function buildSpray(hand, tendency) {
  const pullIF = hand === 'R' ? ['3B', 'SS'] : ['1B', '2B'];
  const oppoIF = hand === 'R' ? ['1B', '2B'] : ['3B', 'SS'];
  const pullOF = hand === 'R' ? 'LF' : 'RF';
  const oppoOF = hand === 'R' ? 'RF' : 'LF';
  if (tendency === 'pull') return {
    gb: [pullIF[0], pullIF[0], pullIF[1], pullIF[1], oppoIF[1], 'P'],
    fb: [pullOF, pullOF, pullOF, 'CF', 'CF', oppoOF],
  };
  if (tendency === 'oppo') return {
    gb: [pullIF[1], oppoIF[1], oppoIF[1], oppoIF[0], oppoIF[0], 'P'],
    fb: [pullOF, 'CF', 'CF', oppoOF, oppoOF, oppoOF],
  };
  return {
    gb: [pullIF[0], pullIF[1], oppoIF[1], oppoIF[0], pullIF[1], 'P'],
    fb: [pullOF, pullOF, 'CF', 'CF', oppoOF, oppoOF],
  };
}
function effectiveHand(bats, pThrows) {
  if (bats === 'S') return pThrows === 'R' ? 'L' : 'R';
  return bats;
}
function sprayFor(batter, pThrows) {
  return buildSpray(effectiveHand(batter.bats, pThrows), batter.spray || 'spray');
}

function d6() { return 1 + Math.floor(Math.random() * 6); }
function rollFace(die) { return die.faces[Math.floor(Math.random() * 6)]; }

// ---------- TEAM STATE ----------
// team = { name, color, order:[pid x9], positions:{C:pid,...}, dh:pid,
//   bench:[pid], sps:[pid], rps:[pid], curP:pid, removed:[pid],
//   batHeat:{pid:n}, pitState:{pid:{fatigue,bf}}, stats:{pid:{...}} }
function emptyBatLine() { return { pa: 0, ab: 0, r: 0, h: 0, d2: 0, d3: 0, hr: 0, rbi: 0, bb: 0, k: 0, sb: 0, ob: 0 }; }
function emptyPitLine() { return { bf: 0, outs: 0, r: 0, k: 0 }; }

function autoOrder(pids) {
  // ONB up top, POW in the middle, weak at the bottom
  const ps = pids.map(id => byId[id]);
  ps.sort((a, b) => (b.onb + b.con) - (a.onb + a.con));
  const top = ps.slice(0, 2);
  const rest = ps.slice(2).sort((a, b) => b.pow - a.pow);
  return [...top, ...rest].map(p => p.id);
}

function makeTeam(name, color, batterIds, positions, dhId, benchIds, spIds, rpIds, keepOrder) {
  const t = {
    name, color,
    order: keepOrder ? batterIds.slice() : autoOrder(batterIds),
    positions: { ...positions },
    dh: dhId,
    bench: [...benchIds],
    sps: [...spIds], rps: [...rpIds],
    curP: spIds[0],
    removed: [],
    batHeat: {}, pitState: {},
    stats: {},
  };
  [...batterIds, ...benchIds].forEach(id => { t.batHeat[id] = 0; t.stats[id] = emptyBatLine(); });
  [...spIds, ...rpIds].forEach(id => { t.pitState[id] = { fatigue: 0, bf: 0 }; if (!t.stats[id]) t.stats[id] = emptyPitLine(); });
  return t;
}

// ---------- GAME STATE ----------
function freshGame(home, away) {
  return {
    inning: 1, half: 'top', outs: 0,
    score: { away: 0, home: 0 },
    lineScore: { away: Array(INNINGS).fill(null), home: Array(INNINGS).fill(null) },
    hits: { away: 0, home: 0 }, errors: { away: 0, home: 0 },
    teams: { home, away },
    userControls: 'home', // 'home' | 'away' | 'both'
    batterIdx: { away: 0, home: 0 },
    runsThisHalf: 0,
    bases: [null, null, null],
    advQueue: [],
    log: ['Play ball!'],
    lastPlay: null,
    over: false,
    finalProcessed: false,
  };
}
function battingSide(g) { return g.half === 'top' ? 'away' : 'home'; }
function fieldingSide(g) { return g.half === 'top' ? 'home' : 'away'; }
function batTeam(g) { return g.teams[battingSide(g)]; }
function fldTeam(g) { return g.teams[fieldingSide(g)]; }
function fielderAt(team, spot) {
  if (spot === 'P') return byId[team.curP];
  return byId[team.positions[spot]];
}
function currentBatter(g) {
  const t = batTeam(g);
  return byId[t.order[g.batterIdx[battingSide(g)]]];
}

function pushEvent(ng, text, detail) {
  if (!ng.lastPlay) ng.lastPlay = { events: [] };
  ng.lastPlay.events.push({ t: text, d: detail || null });
  const tag = `[${ng.half === 'top' ? 'T' : 'B'}${ng.inning}]`;
  ng.log = [...ng.log.slice(-90), `${tag} ${text}${detail ? ` (${detail})` : ''}`];
}
function scoreRuns(ng, n) {
  if (n <= 0) return;
  const side = battingSide(ng);
  ng.score[side] += n;
  ng.runsThisHalf += n;
  const fld = fldTeam(ng);
  const pst = fld.pitState[fld.curP];
  const before = fld.stats[fld.curP].r;
  fld.stats[fld.curP].r += n;
  const li = ng.lineScore[side];
  const idx = Math.min(ng.inning - 1, li.length - 1);
  li[idx] = (li[idx] || 0) + n;
  // pitcher run-fatigue: the starter tires on his 1st, 4th, 7th... run allowed across the whole outing.
  // (RPs tire per inning/run via their own triggers; this cumulative rule is for wearing down.)
  const p = byId[fld.curP];
  if (p.type === 'SP') {
    for (let r = before + 1; r <= before + n; r++) {
      // a starter tires every third run he allows across the outing (his 1st, 4th, 7th...)
      if (r % 3 === 1) {
        const why = r === 1 ? 'settles in after the first run' : `labors — ${r} runs allowed now`;
        pitcherFatigue(ng, fld, why);
      }
    }
  } else {
    // A reliever wears down on every SECOND run he allows across the whole outing (his 2nd, 4th, 6th...),
    // on top of the per-inning step in maybeEndHalf. Cumulative like the starter rule — so a single run
    // no longer costs him a step, but getting shelled still visibly tires him. Capped at 3 by pitcherFatigue.
    for (let r = before + 1; r <= before + n; r++) {
      if (r % 2 === 0) pitcherFatigue(ng, fld, `is getting hit — ${r} runs allowed`);
    }
  }
}
function pitcherFatigue(ng, team, why) {
  const p = byId[team.curP];
  const st = team.pitState[p.id];
  const max = p.type === 'SP' ? 5 : 3;   // RP tires through 3 steps (spin/power/change) then holds
  if (st.fatigue >= max) return;
  st.fatigue += 1;
  const eff = pitEff(p, st.fatigue);
  if (p.type === 'SP' && st.fatigue === 1) {
    pushEvent(ng, `${p.name} tires as he ${why} (warning — no stat loss yet).`);
  } else if (p.type === 'RP' && st.fatigue >= 3) {
    pushEvent(ng, `${p.name} tires (${why}) — he's spent (${eff.pow}/${eff.ctl}/${eff.chg}).`);
  } else {
    pushEvent(ng, `${p.name} tires as he ${why} (now ${eff.pow}/${eff.ctl}/${eff.chg}).`);
  }
  if (p.type === 'SP' && st.fatigue >= 5) {
    pushEvent(ng, `${p.name} is done — he must be relieved before the next pitch.`);
  }
}
function batterHeat(ng, team, pid, delta, why) {
  const p = byId[pid];
  if (!p) return;   // unknown batter (e.g. synthetic runner) — nothing to heat
  const cur = team.batHeat[pid] || 0;
  const next = Math.max(-4, Math.min(4, cur + delta));
  if (next === cur) return;
  team.batHeat[pid] = next;
  pushEvent(ng, `${p.name} ${delta > 0 ? 'heats up' : 'cools down'} (${why}) — ${batHeatDesc(p, next)}.`);
}
// A batter earns at most ONE positive heat step for driving in runs per at-bat, no matter how many
// runs score (some on the hit itself, some via send-home decisions). A walk-off can still upgrade it.
function batterRbiHeat(ng, team, pid, delta, why) {
  if (!ng._rbiHeated) ng._rbiHeated = {};
  const prior = ng._rbiHeated[pid] || 0;
  if (delta <= prior) return;              // already heated this much (or more) for RBIs this at-bat
  batterHeat(ng, team, pid, delta - prior, why);   // only apply the incremental difference
  ng._rbiHeated[pid] = delta;
}

function maybeEndHalf(ng) {
  if (ng.outs < 3 || ng.over) return;
  const fld = fldTeam(ng);
  const fp = byId[fld.curP];
  // RP gains fatigue after each completed inning
  if (fp.type === 'RP') pitcherFatigue(ng, fld, 'finishes the inning');
  // A starter still on the mound once the 7th is in the books is running on fumes — one extra fatigue step.
  else if (fp.type === 'SP' && ng.inning === 7) pitcherFatigue(ng, fld, 'comes out for the late innings');
  ng.advQueue = [];
  ng.bases = [null, null, null];
  ng.outs = 0;
  ng.runsThisHalf = 0;
  // new inning: current pitchers haven't thrown in it yet (exit-fatigue rule)
  ['home', 'away'].forEach(k => {
    const tt = ng.teams[k];
    if (tt.pitState[tt.curP]) tt.pitState[tt.curP].startedThisInning = false;
  });
  if (ng.half === 'top') {
    if (ng.inning >= INNINGS && ng.score.home > ng.score.away) ng.over = true;
    else ng.half = 'bottom';
  } else {
    if (ng.inning >= INNINGS && ng.score.home !== ng.score.away) ng.over = true;
    else { ng.inning += 1; ng.half = 'top'; }
  }
  if (!ng.over) {
    // Manfred runner in extras: last completed batter starts on second
    if (ng.inning > INNINGS) {
      const side = battingSide(ng);
      const t = ng.teams[side];
      const prevIdx = (ng.batterIdx[side] + 8) % 9;
      const r = byId[t.order[prevIdx]];
      ng.bases[1] = { pid: r.id, name: r.name, spd: r.spd };
      ng.log = [...ng.log, `Extra innings: ${r.name} starts on second (Manfred runner).`];
    }
  }
  if (ng.over) finishGame(ng);
}
function checkWalkoff(ng) {
  if (!ng.over && ng.half === 'bottom' && ng.inning >= INNINGS && ng.score.home > ng.score.away) {
    ng.over = true;
    finishGame(ng);
  }
}
function finishGame(ng) {
  if (ng.finalProcessed) return;
  ng.finalProcessed = true;
  ng.log = [...ng.log, `FINAL: ${ng.teams.away.name} ${ng.score.away}, ${ng.teams.home.name} ${ng.score.home}.`];
  // end-of-game batter cool-down: played but never reached base
  ['home', 'away'].forEach(side => {
    const t = ng.teams[side];
    t.order.forEach(pid => {
      const st = t.stats[pid];
      // an 0-fer only stings if he had a real day's worth of chances (3+ AB, never on base)
      if (st && st.ab >= 3 && st.ob === 0) {
        t.batHeat[pid] = Math.max(-4, (t.batHeat[pid] || 0) - 1);
        ng.log = [...ng.log, `${byId[pid].name} went 0-for-${st.ab} and cools off.`];
      }
    });
  });
}

// ---------- AI ----------
function weightedPick(w) {
  const e = Object.entries(w); const tot = e.reduce((s, [, v]) => s + v, 0);
  let r = Math.random() * tot;
  for (const [k, v] of e) { r -= v; if (r <= 0) return k; }
  return e[0][0];
}

// AI baserunning: decide whether to try a steal before the pitch.
// Mirrors attemptSteal's math: out if 2d6 + catcher ARM (+2 to third) ≥ runner SPD + 8.
function aiMaybeSteal(g) {
  const ng = g;
  if (ng.outs >= 3) return;
  const fld = fldTeam(ng);
  const catcher = fielderAt(fld, 'C');
  const cArm = catcher && catcher.arm != null ? catcher.arm : 2;
  // try 2nd first (runner on 1st, 2nd open), then 3rd (runner on 2nd, 3rd open)
  for (let baseIdx = 0; baseIdx <= 1; baseIdx++) {
    const runner = ng.bases[baseIdx];
    if (!runner || ng.bases[baseIdx + 1]) continue;
    const thirdBonus = baseIdx === 1 ? 2 : 0;
    const target = runner.spd + 7;
    // P(safe) = P(2d6 <= target - cArm - thirdBonus)
    const need = target - cArm - thirdBonus;
    let ways = 0;
    for (let a = 1; a <= 6; a++) for (let b = 1; b <= 6; b++) if (a + b <= need) ways++;
    const pSafe = ways / 36;
    // go on good odds; be bolder with 2 outs, more conservative stealing third
    let bar = baseIdx === 1 ? 0.80 : 0.70;
    if (ng.outs === 2) bar -= 0.05;
    if (pSafe >= bar && Math.random() < 0.30) { attemptSteal(ng, baseIdx); return; }
  }
}

// ---- AI die selection (stat-aware) ----
// Both sides weigh their OWN effective skill on each die AND the opposing player's relevant strength.
// Pitcher dice: red=Power(K, hittable), blue=Spin(GB, safe), black=Change(mixed).
// Batter dice: red=Power(HR/XBH), blue=Contact(gap), black=OnBase(walks/singles).
// The batter also earns +3 when their color MATCHES the pitcher's, so each side accounts for that pull.
// Formula (hidden from the player): weight[c] = base 1 + OWN_WEIGHT*(ownStat[c]-ownMid)
//   + opponent adjustments (a pitcher fears batter power on his hittable die; a batter attacks the
//   pitcher's weakest die). Situational nudges (RISP, two outs, man on first) layer on top.
const OWN_W = 0.45;         // how hard a side leans into its own strengths
const OPP_W = 0.35;         // how hard it accounts for the opponent
function aiPitcherDie(g, batterEff) {
  const fld = fldTeam(g);
  const p = byId[fld.curP];
  if (!p) return weightedPick({ red: 1, blue: 1, black: 1 });
  const eff = pitEff(p, (fld.pitState[p.id] && fld.pitState[p.id].fatigue) || 0);
  const own = { red: eff.pow, blue: eff.ctl, black: eff.chg };
  const w = { red: 1, blue: 1, black: 1 };
  // lean into own strong pitches (pitcher stats now center ~6 after the global −1)
  COLORS.forEach(c => { w[c] += OWN_W * (own[c] - 6); });
  // opponent: the batter's power punishes the Power die (fly balls leave the yard); against a slugger,
  // favor Spin (keep it on the ground). Against a patient on-base hitter, Change/Spin avoid walks.
  const bp = batterEff.pow, bo = batterEff.onb, bc = batterEff.con;
  w.red  -= OPP_W * (bp - 4.5);           // don't challenge power with power
  w.blue += OPP_W * (bp - 4.5) * 0.8;     // ground it out instead
  w.blue += OPP_W * (bo - 4.5) * 0.4;     // control also limits the walk vs a patient hitter
  w.black += OPP_W * (bc - 4.5) * 0.3;    // change of speed disrupts a pure contact bat
  // situational
  const runners = g.bases.filter(Boolean).length;
  if (g.outs === 2 && runners > 0) w.red += 0.8;      // two down, go for the K
  if (g.bases[0] && g.outs < 2) w.blue += 1.0;        // man on first, want the DP grounder
  COLORS.forEach(c => { if (w[c] < 0.2) w[c] = 0.2; });
  return weightedPick(w);
}
function aiBatterDie(g, batterEff) {
  const fld = fldTeam(g);
  const p = byId[fld.curP];
  const pEff = p ? pitEff(p, (fld.pitState[p.id] && fld.pitState[p.id].fatigue) || 0) : { pow: 6, ctl: 6, chg: 6 };
  const own = { red: batterEff.pow, blue: batterEff.con, black: batterEff.onb };
  const w = { red: 1, blue: 1, black: 1 };
  // lean into own strong bats (batter stats now center ~4.5 after the global −1)
  COLORS.forEach(c => { w[c] += OWN_W * (own[c] - 4.5); });
  // ---- opponent read (the key strategic layer) ----
  // A pitcher leans on his STRONGEST die, so first estimate how often he throws each color. Then value
  // each batter color by its expected edge: matching the pitcher's color earns a flat +3, which is most
  // valuable precisely against the pitch he throws most. So the batter should SIT ON the pitcher's best
  // die (e.g. sit dead-red on a 10-power fastball artist) to cash the match bonus as often as possible,
  // rather than chasing his weak dice. This discourages a pitcher from simply spamming one elite pitch.
  const pPit = { red: pEff.pow, blue: pEff.ctl, black: pEff.chg };
  const pMid = (pPit.red + pPit.blue + pPit.black) / 3;
  // pitcher's throw mix: softmax-ish on his stats (he favors his strong dice)
  const pw = {}; let pwSum = 0;
  COLORS.forEach(c => { pw[c] = Math.exp((pPit[c] - pMid) * 0.55); pwSum += pw[c]; });
  const pThrow = {}; COLORS.forEach(c => { pThrow[c] = pw[c] / pwSum; });
  // value of each batter color = P(pitcher throws this color) * matchValue(+3 edge) − small penalty for
  // how strong the pitcher is on that die (a hittable-but-matched pitch still beats an unmatched one).
  COLORS.forEach(c => {
    const matchEdge = pThrow[c] * 3;                 // +3 whenever the pitcher also throws c
    const stiffness = OPP_W * (pPit[c] - pMid);      // his raw strength on that die (mild deterrent)
    w[c] += OPP_W * matchEdge * 1.6 - stiffness * 0.5;
  });
  // situational
  const runners = g.bases.filter(Boolean).length;
  if (runners > 0 && g.outs < 2) w.blue += 0.8;                 // runners on, put it in play
  if (runners > 1 && batterEff.pow >= 5) w.red += 0.8;          // big spot for a slugger (max pow ~7 now)
  if (g.outs === 2 && runners === 0) w.black += 0.5;            // two down, empty — just get on
  COLORS.forEach(c => { if (w[c] < 0.2) w[c] = 0.2; });
  return weightedPick(w);
}

// ---------- BASERUNNING DECISIONS ----------
function buildDecision(kind, fromBase, runner, thrower, batterId, extraSpd) {
  const home = kind === 'r2home' || kind === 'r1home' || kind === 'tag3home' || kind === 'gb3home' || kind === 'sendHome2';
  // the +1 "bang-bang at the plate" bonus does NOT apply to the contact play off a grounder
  const plateBonus = (home && kind !== 'gb3home') ? 1 : 0;
  // tagging first->second on a fly is a tough send (short throw, little time): -1 speed for the runner
  const tagPenalty = kind === 'tag1second' ? -1 : 0;
  const target = runner.spd + 7 + plateBonus + tagPenalty + (extraSpd || 0);
  // human-readable derivation of the OUT threshold (out ≥ target+1 = 8 + spd + modifiers)
  const parts = [`8`, `spd${runner.spd}`];
  if (plateBonus) parts.push(`+${plateBonus} home`);
  if (tagPenalty) parts.push(`${tagPenalty} tag-to-2nd`);
  const breakdown = parts.join(' ').replace(/ \+/g, ' + ').replace(/ -/g, ' − ');
  const labels = {
    tag3home: `Tag up: send ${runner.name} home?`,
    tag2third: `Tag up: send ${runner.name} to third?`,

// The automatic runs off the hit itself are credited separately (line.rbi += immediateRuns).
function creditRbi(ng, batterId, n) {
  if (batterId == null) return;
  const t = batTeam(ng);
  if (t.stats[batterId]) t.stats[batterId].rbi += (n || 1);
}

// ---------- STEALS ----------
// Double steal: runners on 1st & 2nd both go. The defense throws to ONE base; the other runner
// is automatically safe. `throwAt` is 3 (nab the lead runner) or 2 (nab the trail).
function doubleSteal(g, throwAt) {
  const ng = g;
  const lead = ng.bases[1], trail = ng.bases[0];
  if (!lead || !trail || ng.bases[2]) return ng;
  const fld = fldTeam(ng);
  const catcher = fielderAt(fld, 'C');
  const cArm = catcher ? catcher.arm : 2;
  const t1 = d6(), t2 = d6();
  ng.lastPlay = { events: [], steal: true };
  const t = batTeam(ng);
  const credit = (r) => { if (r.pid && t.stats[r.pid]) t.stats[r.pid].sb += 1; };
  if (throwAt === 3) {
    // throw to third at the lead runner (+2 for the long throw); trail runner takes 2nd free
    const total = t1 + t2 + cArm + 2;
    const target = lead.spd + 7;
    const det = `${catcher.name} to 3rd: d${t1}+d${t2}+arm${cArm}+2 = ${total} (out ≥ ${target + 1})`;
    ng.bases[0] = null; ng.bases[1] = trail;   // trail advances to 2nd
    if (total > target) {
      recordOut(ng); ng.bases[2] = null;
      pushEvent(ng, `Double steal — ${lead.name} is caught at third! ${trail.name} takes second.`, det);
      maybeEndHalf(ng);
    } else {
      ng.bases[2] = lead; credit(lead); credit(trail);
      pushEvent(ng, `Double steal — both runners move up! ${lead.name} to third, ${trail.name} to second.`, det);
    }
  } else {
    // throw to second at the trail runner; lead runner takes 3rd free
    const total = t1 + t2 + cArm;
    const target = trail.spd + 7;
    const det = `${catcher.name} to 2nd: d${t1}+d${t2}+arm${cArm} = ${total} (out ≥ ${target + 1})`;
    ng.bases[0] = null; ng.bases[2] = lead;    // lead advances to 3rd
    if (total > target) {
      recordOut(ng); ng.bases[1] = null;
      pushEvent(ng, `Double steal — ${trail.name} is thrown out at second! ${lead.name} takes third.`, det);
      maybeEndHalf(ng);
    } else {
      ng.bases[1] = trail; credit(lead); credit(trail);
      pushEvent(ng, `Double steal — both runners move up! ${lead.name} to third, ${trail.name} to second.`, det);
    }
  }
  return ng;
}

function attemptSteal(g, baseIdx) {
  const ng = g;
  const runner = ng.bases[baseIdx];
  if (!runner || baseIdx >= 2 || ng.bases[baseIdx + 1]) return ng;
  const fld = fldTeam(ng);
  const catcher = fielderAt(fld, 'C');
  const cArm = catcher ? catcher.arm : 2;
  const t1 = d6(), t2 = d6();
  const thirdBonus = baseIdx === 1 ? 2 : 0;
  const throwTotal = t1 + t2 + cArm + thirdBonus;
  const target = runner.spd + 7;
  const baseName = ['second', 'third'][baseIdx];
  ng.lastPlay = { events: [], steal: true };
  const det = `${catcher.name}: d${t1} + d${t2} + arm${cArm}${thirdBonus ? ' + third2' : ''} = ${throwTotal} (out ≥ ${target + 1})`;
  if (throwTotal > target) {
    recordOut(ng);
    ng.bases[baseIdx] = null;
    pushEvent(ng, `${runner.name} caught stealing ${baseName} by ${catcher.name}!`, det);
    maybeEndHalf(ng);
  } else {
    ng.bases[baseIdx + 1] = runner;
    ng.bases[baseIdx] = null;
    const t = batTeam(ng);
    if (runner.pid && t.stats[runner.pid]) t.stats[runner.pid].sb += 1;
    pushEvent(ng, `${runner.name} steals ${baseName}!`, det);
  }
  return ng;
}

// ---------- INTENTIONAL WALK ----------
function issueIBB(g) {
  const ng = g;
  const batter = currentBatter(ng);
  const t = batTeam(ng);
  const side = battingSide(ng);
  const line = t.stats[batter.id];
  ng.lastPlay = { events: [], outcome: 'W' };
  pushEvent(ng, `${batter.name} is intentionally walked.`);
  line.pa++; line.bb++; line.ob++;
  fldTeam(ng).stats[fldTeam(ng).curP].bf++;
  let runs = 0;
  if (ng.bases[0]) {
    if (ng.bases[1]) {
      if (ng.bases[2]) { runs++; creditRun(ng, ng.bases[2]); pushEvent(ng, `${ng.bases[2].name} is forced home.`); ng.bases[2] = null; }
      ng.bases[2] = ng.bases[1];
    }
    ng.bases[1] = ng.bases[0];
  }
  ng.bases[0] = { pid: batter.id, name: batter.name, spd: batter.spd };
  if (runs > 0) { line.rbi += runs; scoreRuns(ng, runs); }
  ng.batterIdx[side] = (ng.batterIdx[side] + 1) % 9;
  checkWalkoff(ng);
  return ng;
}

// ---------- CORE AT-BAT ----------
function resolveAtBat(g, pColor, bColor) {
  const ng = g;
  ng._tagPlay = null;   // clear any stale fly-ball tag-play state from the previous at-bat
  ng._tagResolve = null;
  ng._hitDecl = null; ng._hitPlay = null;   // clear stale hit-advance declaration state
  ng._rbiHeated = {};  // reset the per-at-bat RBI heat guard
  const side = battingSide(ng);
  const bt = batTeam(ng);
  const ft = fldTeam(ng);
  const batter = currentBatter(ng);
  if (!byId[ft.curP]) {
    // safety: repair an invalid current pitcher by installing any rostered arm
    const anyArm = [...ft.sps, ...ft.rps].find(id => byId[id] && !ft.removed.includes(id)) || [...ft.sps, ...ft.rps][0];
    ft.curP = anyArm;
    if (!ft.pitState[ft.curP]) ft.pitState[ft.curP] = { fatigue: 0, bf: 0 };
    if (!ft.stats[ft.curP] || ft.stats[ft.curP].bf === undefined) ft.stats[ft.curP] = emptyPitLine();
  }
  const pitcher = byId[ft.curP];
  const pst = ft.pitState[pitcher.id];
  const bHeat = bt.batHeat[batter.id] || 0;
  const line = bt.stats[batter.id];
  const pline = ft.stats[pitcher.id];
  const userBatting = ng.userControls === side || ng.userControls === 'both';
  const risp = !!(ng.bases[1] || ng.bases[2]);
  const runnersOnAtStart = ng.bases.some(Boolean);
  const rispAtStart = !!(ng.bases[1] || ng.bases[2]);   // runner in scoring position

  const bEffAll = batEff(batter, bHeat);
  const pEffAll = pitEff(pitcher, pst.fatigue);

  const bKey = BATTER_DICE[bColor].key;
  const pKey = PITCHER_DICE[pColor].key;
  const bStat = bEffAll[bKey];
  const pStat = pEffAll[pKey];

  const pFace = rollFace(PITCHER_DICE[pColor]);
  const bFace = rollFace(BATTER_DICE[bColor]);
  const colorMatch = pColor === bColor;
  const handMatch = batter.bats !== 'S' && batter.bats === pitcher.throws;
  const bBonus = colorMatch ? 3 : 0;
  const pBonus = handMatch ? 1 : 0;
  const pTotal = pFace.v + pStat + pBonus;
  const bTotal = bFace.v + bStat + bBonus;
  const batterWins = bTotal > pTotal; // ties go to the pitcher
  let outcome = batterWins ? bFace.res : pFace.res;

  ng.lastPlay = {
    events: [], outcome, pColor, bColor, colorMatch,
  };
  const pKeyU = pKey.toUpperCase();
  const bKeyU = bKey === 'pow' ? 'POW' : bKey === 'con' ? 'CON' : 'ONB';
  pushEvent(ng,
    `${batterWins ? batter.name + ' wins the at-bat' : pitcher.name + ' wins the at-bat'} — ${outcome} on the ${batterWins ? BATTER_DICE[bColor].name : PITCHER_DICE[pColor].name} die.`,
    `${pitcher.name}: ${pKeyU}${pStat} + ${pFace.res}${pFace.v}${pBonus ? ' + platoon1' : ''} = ${pTotal} · ${batter.name}: ${bKeyU}${bStat} + ${bFace.res}${bFace.v}${bBonus ? ' + match3' : ''} = ${bTotal}`);

  line.pa++;
  pline.bf++;

  // ---- ball in play ----
  let gbCtx = null;
  if (outcome === 'GB' || outcome === 'FB') {
    const chart = sprayFor(batter, pitcher.throws);
    const zone = d6();
    const spot = (outcome === 'GB' ? chart.gb : chart.fb)[zone - 1];
    const fielder = fielderAt(ft, spot);
    const dv = spot === 'P' ? 1 : effDefAt(fielder, spot);
    const kind = outcome === 'GB' ? 'grounder' : 'fly ball';
    const f1 = d6(), f2 = d6();
    const total = f1 + f2 + dv;
    const det = `d${f1} + d${f2} + def${dv} = ${total} (out ≥ ${FIELD_TARGET})`;
    if (f1 === 1 && f2 === 1) {
      pushEvent(ng, `${kind} to ${fielder.name} — double 1s, he boots it! Error.`, det);
      if (spot !== 'P') batterHeat(ng, ft, fielder.id, -1, 'error');
      outcome = 'E';
    } else if (f1 === 6 && f2 === 6) {
      pushEvent(ng, `${kind} to ${fielder.name} — DOUBLE 6s, WEB GEM!`, det);
      if (spot !== 'P') batterHeat(ng, ft, fielder.id, +1, 'web gem');
      gbCtx = { pos: spot, dpAuto: true, dpEligible: true };
      ng._lastFielder = { name: fielder.name, arm: fielder.arm != null ? fielder.arm : 2 };
    } else if (total >= FIELD_TARGET) {
      pushEvent(ng, `${kind} to ${fielder.name}, he makes the play.`, det);
      ng._lastFielder = { name: fielder.name, arm: fielder.arm != null ? fielder.arm : 2 };
      gbCtx = { pos: spot, dpAuto: false, dpEligible: total >= 9 };
    } else {
      pushEvent(ng, `${kind} ${outcome === 'GB' ? 'gets past' : 'drops in front of'} ${fielder.name} — a single!`, det);
      outcome = '1B';
    }
  }

  const runnerObj = { pid: batter.id, name: batter.name, spd: batter.spd };
  // the infielder who fielded the grounder makes the throw
  const gbThrower = (spot) => {
    const f = fielderAt(ft, spot || '2B');
    return f ? { name: f.name, arm: f.arm != null ? f.arm : 2 } : { name: 'the infielder', arm: 2 };
  };
  const hitThrower = () => {
    const spot = sprayFor(batter, pitcher.throws).fb[d6() - 1];
    const f = fielderAt(ft, spot);
    return f ? { name: f.name, arm: f.arm != null ? f.arm : 2 } : { name: 'the outfielder', arm: 2 };
  };
  let immediateRuns = 0;
  const forceAdvance = (n) => {
    for (let i = 0; i < n; i++) {
      if (ng.bases[2]) { immediateRuns++; creditRun(ng, ng.bases[2]); ng.bases[2] = null; }
      ng.bases[2] = ng.bases[1]; ng.bases[1] = ng.bases[0]; ng.bases[0] = null;
    }
  };

  switch (outcome) {
    case 'K':
      recordOut(ng); line.ab++; line.k++;
      pline.k++;
      pushEvent(ng, `${batter.name} strikes out.`);
      break;
    case 'GB': {
      line.ab++;
      const ctx = gbCtx || { pos: '2B', dpAuto: false, dpEligible: false };
      const rightSide = ctx.pos === '1B' || ctx.pos === '2B' || ctx.pos === 'P';  // ball hit behind a man on 2nd
      const leftSide = ctx.pos === '3B' || ctx.pos === 'SS';

      // STEP 0b: with 2 outs, the batter's out at first is the third out — inning over,
      // no baserunning decisions and no runs score.
      if (ng.outs >= 2) {
        recordOut(ng);
        pushEvent(ng, `${batter.name} is out at first — three away, no runs score.`);
        break;
      }

      const r1 = ng.bases[0], r2 = ng.bases[1], r3 = ng.bases[2];
      const dpCtx = { dpEligible: ctx.dpEligible || ctx.dpAuto, dpAuto: ctx.dpAuto,
                      batterObj: runnerObj, batterSpd: batter.spd, fieldPos: ctx.pos };

      // ---- BASES LOADED: runner on 3rd is forced home; defense picks throw-home vs turn-two ----
      if (r1 && r2 && r3) {
        ng.advQueue.push({
          kind: 'forceChoice', defense: true,
          r3, r1, batterObj: runnerObj, batterSpd: batter.spd, fieldPos: ctx.pos,
          dpEligible: dpCtx.dpEligible, dpAuto: ctx.dpAuto,
          label: `Bases loaded grounder to ${ctx.pos} — throw home, or turn two?` });
        break;
      }

      // ---- 1st & 2nd: force at the lead runner (man on 2nd -> 3rd) ----
      if (r1 && r2 && !r3) {
        if (leftSide) {
          // ball to SS/3B: the lead runner is auto-forced at third (fielder is right there)
          recordOut(ng);
          ng.bases[1] = ng.bases[0]; ng.bases[0] = null;   // R2 out at 3rd; R1 slides to 2nd
          pushEvent(ng, `Grounder to ${ctx.pos} — ${r2.name} is forced at third for the lead out.`);
          if (ng.outs < 3 && tryRelayDP(ng, ctx, batter, pline)) { ng.bases[1] = null; }
          else if (ng.outs < 3) ng.bases[0] = runnerObj;
          break;
        }
        // ball to 1B/2B/P: DEFENSE chooses — speed-check the lead runner at 3rd, or the free out at 2nd
        ng.advQueue.push(buildLeadOrFree(r2, 2, r1, 1, gbThrower(ctx.pos), batter.id, dpCtx));
        break;
      }

      // ---- 1st only: straight force out at second, DP at first if 9+ ----
      if (r1 && !r2 && !r3) {
        recordOut(ng);
        ng.bases[0] = null;
        pushEvent(ng, `Grounder to ${ctx.pos} — ${r1.name} is forced at second.`);
        if (ng.outs < 3 && tryRelayDP(ng, ctx, batter, pline)) { /* DP: batter out too */ }
        else if (ng.outs < 3) ng.bases[0] = runnerObj;
        break;
      }

      // ---- 1st & 3rd: man on 3rd (non-forced) may be sent home; man on 1st is the force out at 2nd ----
      if (r1 && !r2 && r3) {
        // batting decides whether to send the runner from third; the defense then weighs plate vs the
        // free out at second. If held, take the force at second (and DP at first if 9+).
        ng.advQueue.push(buildGbLead3rd(r3, r1, ctx, gbThrower(ctx.pos), batter.id, dpCtx));
        break;
      }

      // ---- No force (nobody on 1st): batter is out at first; non-forced runners may try to advance ----
      // Batting decisions: send 3rd->home; send 2nd->3rd (only if ball to 1B/2B/P).
      const sendable = [];
      if (r3) sendable.push(buildGbAdvance(r3, 2, batter, runnerObj, ctx.pos, gbThrower(ctx.pos)));
      if (r2 && rightSide) sendable.push(buildGbAdvance(r2, 1, batter, runnerObj, ctx.pos, gbThrower(ctx.pos)));
      if (sendable.length) {
        sendable.forEach(d => ng.advQueue.push(d));
      } else {
        recordOut(ng);
        const held = r2 ? ` ${r2.name} holds at second.` : '';
        pushEvent(ng, `${batter.name} is out at first.${held}`);
      }
      break;
    }
    case 'FB': {
      recordOut(ng); line.ab++;
      pushEvent(ng, `${batter.name} flies out.`);
      if (ng.outs < 3) {
        const cf = ng._lastFielder || { name: 'the outfielder', arm: 2 };
        // Any runner may tag up. The offense must DECLARE all sends before any throw is resolved
        // (declare:true) — deepest-first. Runners going home get +1; a runner going 1st->2nd gets -1.
        // Once every runner is declared, all sent runners resolve at once; the SECOND runner the defense
        // must throw at gets +2 (they can't be two places at once).
        ng._tagPlay = { sent: 0 };
        ng._tagDecl = [];   // collected declarations, resolved together once all are in
        const mkTag = (kind, from, r) => { const dd = buildDecision(kind, from, r, cf, batter.id); dd.declare = true; return dd; };
        if (ng.bases[2]) ng.advQueue.push(mkTag('tag3home', 2, ng.bases[2]));
        if (ng.bases[1]) ng.advQueue.push(mkTag('tag2third', 1, ng.bases[1]));
        if (ng.bases[0]) ng.advQueue.push(mkTag('tag1second', 0, ng.bases[0]));
      }
      break;
    }
    case 'W': {
      pushEvent(ng, `${batter.name} works a walk.`);
      line.bb++; line.ob++;
      if (ng.bases[0]) {
        if (ng.bases[1]) {
          if (ng.bases[2]) { immediateRuns++; creditRun(ng, ng.bases[2]); pushEvent(ng, `${ng.bases[2].name} is forced home — run walks in.`); ng.bases[2] = null; }
          ng.bases[2] = ng.bases[1];
        }
        ng.bases[1] = ng.bases[0];
      }
      ng.bases[0] = runnerObj;
      break;
    }
    case 'E':
      pushEvent(ng, `${batter.name} reaches SECOND on the error — everybody moves up an extra base!`);
      line.ab++; line.ob++;
      ng.errors[fieldingSide(ng)] += 1;
      forceAdvance(2); ng.bases[1] = runnerObj;
      break;
    case '1B': {
      pushEvent(ng, `${batter.name} singles.`);
      line.ab++; line.h++; line.ob++;
      ng.hits[side]++;
      const r3start = ng.bases[2]; const r2 = ng.bases[1]; const r1 = ng.bases[0];
      const infieldHit = gbCtx && batter.spd >= 2 && r3start && !r2 && !r1;   // beat out an infield chopper, run from 3rd
      forceAdvance(1);
      ng.bases[0] = runnerObj;
      const th1 = hitThrower();
      // (A) runners on 1st & 2nd: the BATTING side declares BOTH sends first — the runner from 2nd (now
      //     on third) trying for home, and the trail runner from 1st trying for third — before the defense
      //     picks where to throw. Two-phase: declare all, then one throw (the un-thrown runner is safe).
      if (r2 && r1 && ng.bases[2] && ng.bases[2].name === r2.name) {
        ng._hitPlay = { thrower: th1, batterId: batter.id };
        const dHome = buildDecision('sendHome2', 2, r2, th1, batter.id); dHome.hitDeclare = true;
        ng.advQueue.push(dHome);
        if (ng.bases[1] && ng.bases[1].name === r1.name) {
          const dThird = buildDecision('r1third', 1, r1, th1, batter.id); dThird.hitDeclare = true;
          ng.advQueue.push(dThird);
        }
      } else if (infieldHit && ng.bases[2] && ng.bases[2].name === r3start.name) {
        // (B) infield single, runner from 3rd: batting sends, then defense may throw home (batter safe at 1st)
        ng.advQueue.push(buildDecision('r2home', 2, r3start, gbThrower(gbCtx.pos), batter.id));
      } else {
        if (r2 && ng.bases[2] && ng.bases[2].name === r2.name) ng.advQueue.push(buildDecision('r2home', 2, r2, th1, batter.id));
        if (r1 && ng.bases[1] && ng.bases[1].name === r1.name) ng.advQueue.push(buildDecision('r1third', 1, r1, th1, batter.id));
      }
      break;
    }
    case '2B': {
      pushEvent(ng, `${batter.name} doubles!`);
      line.ab++; line.h++; line.d2++; line.ob++;
      ng.hits[side]++;
      const r1 = ng.bases[0];
      forceAdvance(2);
      ng.bases[1] = runnerObj;
      if (r1 && ng.bases[2] && ng.bases[2].name === r1.name) ng.advQueue.push(buildDecision('r1home', 2, r1, hitThrower(), batter.id));
      break;
    }
    case '3B':
      pushEvent(ng, `${batter.name} TRIPLES into the gap!`);
      line.ab++; line.h++; line.d3++; line.ob++;
      ng.hits[side]++;
      forceAdvance(3); ng.bases[2] = runnerObj;
      break;
    case 'HR': {
      const rbis = 1 + ng.bases.filter(Boolean).length;
      pushEvent(ng, rbis === 4 ? `GRAND SLAM ${batter.name.toUpperCase()}!` : `${batter.name} HOMERS! ${rbis} run${rbis > 1 ? 's' : ''} score.`);
      line.ab++; line.h++; line.hr++; line.ob++; line.r++;
      ng.hits[side]++;
      ng.bases.forEach(r => { if (r) creditRun(ng, r); });
      immediateRuns += rbis;
      ng.bases = [null, null, null];
      break;
    }
    default: break;
  }

  if (immediateRuns > 0) {
    line.rbi += immediateRuns;
    scoreRuns(ng, immediateRuns);
  }
  // ---- NEW CLICK TRIGGERS ----
  const isHit = ['1B', '2B', '3B', 'HR'].includes(outcome);
  const isWalk = outcome === 'BB';
  const isWalkoff = ng.half === 'bottom' && ng.inning >= INNINGS && ng.score.home > ng.score.away && immediateRuns > 0;
  // UP: an RBI-driving hit (double on a walk-off), or reaching base for the 2nd+ time (hit or walk)
  const timesOn = (line.h || 0) + (line.bb || 0);
  if (isHit && immediateRuns > 0) {
    batterRbiHeat(ng, bt, batter.id, isWalkoff ? +2 : +1, isWalkoff ? 'walk-off hit!' : 'RBI hit');
  } else if ((isHit || isWalk) && timesOn === 2) {
    batterHeat(ng, bt, batter.id, +1, 'second time on base');
  }
  // DOWN: making the last out of an inning with RISP, OR striking out with a runner in scoring position.
  const madeOut = ['K', 'GB', 'FB'].includes(outcome);
  if (madeOut && ng.outs >= 3 && rispAtStart) {
    batterHeat(ng, bt, batter.id, -1, 'stranding a runner in scoring position');
  } else if (outcome === 'K' && rispAtStart) {
    batterHeat(ng, bt, batter.id, -1, 'striking out with a runner in scoring position');
  }

  const li = ng.lineScore[side];
  const lidx = Math.min(ng.inning - 1, li.length - 1);
  if (li[lidx] === null) li[lidx] = 0;

  ng.batterIdx[side] = (ng.batterIdx[side] + 1) % 9;

  // SP lineup-turnover fatigue (after every 9 batters faced)
  if (pitcher.type === 'SP' && pline.bf > 0 && pline.bf % 9 === 0 && ft.pitState[pitcher.id].fatigue < 4) {
    pitcherFatigue(ng, ft, 'works through the order again');
  }

  drainDecisionsAI(ng);   // resolve any decisions the AI owns; stops at a user-owned one
  if (ng.advQueue.length === 0) maybeEndHalf(ng);
  checkWalkoff(ng);
  return ng;
}

// ---------- SUBSTITUTIONS ----------
// pitching change: newPid must be an unused RP (or unused SP if none pitched yet? keep RP-only after SP)
function changePitcher(g, newPid) {
  const ng = g;
  const ft = fldTeam(ng);
  const oldP = byId[ft.curP];
  const oldSt = ft.pitState[oldP.id];
  // RP exit fatigue: only if he has pitched in the CURRENT inning
  if (oldP.type === 'RP' && oldSt.startedThisInning) {
    pitcherFatigue(ng, ft, 'exits mid-inning');
  }
  ft.removed.push(oldP.id);
  ft.curP = newPid;
  if (!ft.stats[newPid] || ft.stats[newPid].bf === undefined) ft.stats[newPid] = emptyPitLine();
  const np = byId[newPid];
  pushEvent(ng, `Pitching change: ${np.name} replaces ${oldP.name}.`);
  return ng;
}
// AI pitching management: force sub a done SP, or swap a floored RP for a fresh arm
function aiManagePitching(ng) {
  const ft = fldTeam(ng);
  const p = byId[ft.curP];
  if (!p) return ng;
  const st = ft.pitState[p.id];
  if (!st) return ng;
  const freshArms = () => [...ft.sps, ...ft.rps].filter(id =>
    id !== ft.curP && !ft.removed.includes(id) && ft.pitState[id] &&

  // Best available reliever (freshest, then best stuff). Prefer actual RELIEVERS — a starter should
  // never be used in relief unless literally no reliever arm remains (true emergency).
  const rank = (id) => {
    const q = byId[id];

  const emergencyArm = relievers[0];

    // (entire bullpen gassed) fall back to a starter rather than leaving a spent 7/6/7 arm out there.
    const sub = bestRelief || emergencyArm;
    if (sub) changePitcher(ng, sub);

  if (!bestRelief) return;   // discretionary pulls need a real reliever ready; otherwise ride it out

  // --- discretionary pulls: a real manager doesn't wait for the arm to fall off, but also doesn't burn
  // the bullpen by yanking a starter who's still cruising. Let starters go deeper. ---
  if (p.type === 'SP') {
    const eff = pitEff(p, st.fatigue);

    if (tired && muchBetter && (late || (highLeverage && st.fatigue >= 4))) {
      changePitcher(ng, bestRelief); return;
    }

    if ((ft.stats[p.id] && ft.stats[p.id].r >= 5) && relStuff > spStuff) {

}

  if (league.activeDay === day) return;
  league.activeDay = day;
  league.rosters.forEach(r => {
    const clk = r.fatigue || {};
    const heat = r.heat || {};
    const appeared = r.appeared || { pit: {}, bat: {} };
    const nextClk = {};
    Object.keys(clk).forEach(pid => { nextClk[pid] = towardZero(clk[pid], appeared.pit[pid] ? 1 : 2); });
    const nextHeat = {};
    Object.keys(heat).forEach(pid => { nextHeat[pid] = appeared.bat[pid] ? heat[pid] : towardZero(heat[pid], 2); });
    r.fatigue = nextClk;
    r.heat = nextHeat;
    r.appeared = { pit: {}, bat: {} };
  });
}

// current day = the lowest day number with any unplayed game
function currentDay(league) {
  const un = league.schedule.filter(g => !g.played);
  return un.length ? Math.min(...un.map(g => g.day)) : (Math.max(...league.schedule.map(g => g.day)) + 1);
}

function extractBox(t) {
  const bat = {}, pit = {};
  Object.keys(t.stats).forEach(id => {
    if (!byId[id]) return;
    if (byId[id].type === 'B') { if (t.stats[id].pa > 0) bat[id] = t.stats[id]; }
    else { if (t.stats[id].bf > 0) pit[id] = t.stats[id]; }
  });
  return { bat, pit };
}

function simLeagueGame(homeLR, awayLR) {
  const homeT = teamFromRoster(homeLR);
  const awayT = teamFromRoster(awayLR);
  // (fatigue carried inside teamFromRoster via lr.fatigue)
  const g = freshGame(homeT, awayT);
  g.userControls = 'none';
  let guard = 0;
  while (!g.over && guard < 4000) {
    aiManagePitching(g);
    aiMaybeSteal(g);
    if (g.over) break;
    const ft = fldTeam(g);
    const b = currentBatter(g);
    const bEff = batEff(b, batTeam(g).batHeat[b.id] || 0);
    if (ft.pitState[ft.curP]) ft.pitState[ft.curP].startedThisInning = true;
    resolveAtBat(g, aiPitcherDie(g, bEff), aiBatterDie(g, bEff));
    drainDecisionsAI(g);
    if (g.advQueue.length === 0) maybeEndHalf(g);
    guard++;
  }
  homeLR.fatigue = harvestFatigue(g.teams.home);
  awayLR.fatigue = harvestFatigue(g.teams.away);
  homeLR.heat = harvestHeat(g.teams.home);
  awayLR.heat = harvestHeat(g.teams.away);
  homeLR.appeared = harvestAppeared(g.teams.home);
  awayLR.appeared = harvestAppeared(g.teams.away);
  return {
    home: homeLR.idx, away: awayLR.idx,
    homeScore: g.score.home, awayScore: g.score.away,
    innings: g.inning,
    boxHome: extractBox(g.teams.home), boxAway: extractBox(g.teams.away),
    played: true,
  };
}


// ---------- SEASON HISTORY + ALL-TIME STATS ----------
// league.history: [{ season, order:[rosterIdx ...best-first], champion }]
// league.allTime: { bat: {pid: line}, pit: {pid: line} }  accumulated across every finished season
const BAT_KEYS = ['pa','ab','r','h','d2','d3','hr','rbi','bb','k','sb','ob','g'];
const PIT_KEYS = ['bf','outs','r','k','g'];
function mergeAllTime(league) {
  if (!league.allTime) league.allTime = { bat: {}, pit: {} };
  const agg = aggregateLeaders(league);      // this season only
  Object.keys(agg.bat).forEach(id => {
    if (!league.allTime.bat[id]) league.allTime.bat[id] = BAT_KEYS.reduce((o,k)=>(o[k]=0,o), {});
    BAT_KEYS.forEach(k => { league.allTime.bat[id][k] += (agg.bat[id][k] || 0); });
  });
  Object.keys(agg.pit).forEach(id => {
    if (!league.allTime.pit[id]) league.allTime.pit[id] = PIT_KEYS.reduce((o,k)=>(o[k]=0,o), {});
    PIT_KEYS.forEach(k => { league.allTime.pit[id][k] += (agg.pit[id][k] || 0); });
  });
}
// finishes[rosterIdx] = { first, second, third, titles }
function finishCounts(league) {
  const out = {};
  league.rosters.forEach(r => { out[r.idx] = { first: 0, second: 0, third: 0, titles: 0 }; });
  (league.history || []).forEach(h => {
    (h.order || []).forEach((idx, place) => {
      if (!out[idx]) return;
      if (place === 0) out[idx].first++;
      else if (place === 1) out[idx].second++;
      else if (place === 2) out[idx].third++;
    });
    if (h.champion != null && out[h.champion]) out[h.champion].titles++;
  });
  return out;
}

function computeStandings(league) {
  const rows = league.rosters.map(r => ({ idx: r.idx, name: r.name, color: r.color, w: 0, l: 0, rf: 0, ra: 0 }));
  league.schedule.forEach(gm => {
    if (!gm.played || !gm.result) return;
    const h = rows[gm.home], a = rows[gm.away];
    h.rf += gm.result.homeScore; h.ra += gm.result.awayScore;
    a.rf += gm.result.awayScore; a.ra += gm.result.homeScore;
    if (gm.result.homeScore > gm.result.awayScore) { h.w++; a.l++; } else { a.w++; h.l++; }
  });
  rows.forEach(r => { r.diff = r.rf - r.ra; });
  rows.sort((x, y) => (y.w - x.w) || (y.diff - x.diff) || (y.rf - x.rf));
  return rows;
}


// ---------- PLAYOFFS + LEADERS (Piece 5) ----------
function makePlayoffs(league) {
  const st = computeStandings(league);
  return {
    seeds: st.map(r => r.idx),
    stage: 'playin',
    playin: { home: st[1].idx, away: st[2].idx, played: false, result: null },
    final: { games: [], winnerId: null },
    champion: null,
  };
}
function advancePlayin(po, result) {
  po.playin.played = true; po.playin.result = result;
  const winner = result.homeScore > result.awayScore ? po.playin.home : po.playin.away;
  po.stage = 'final';
  const one = po.seeds[0];
  po.final.games = [
    { home: one, away: winner, played: false, result: null },
    { home: winner, away: one, played: false, result: null },
    { home: one, away: winner, played: false, result: null },
  ];
  po.final.winnerId = winner;
}
function advanceFinal(po, gi, result) {
  po.final.games[gi].played = true; po.final.games[gi].result = result;
  const one = po.seeds[0];
  let a = 0, b = 0;
  po.final.games.forEach(g => {
    if (!g.played) return;
    const w = g.result.homeScore > g.result.awayScore ? g.home : g.away;
    if (w === one) a++; else b++;
  });
  if (a >= 2) po.champion = one;
  else if (b >= 2) po.champion = po.final.winnerId;
}
function aggregateLeaders(league) {
  const bat = {}, pit = {};
  const addGame = (box) => {
    Object.keys(box.bat).forEach(id => {
      if (!bat[id]) bat[id] = { pa: 0, ab: 0, r: 0, h: 0, d2: 0, d3: 0, hr: 0, rbi: 0, bb: 0, k: 0, sb: 0, ob: 0, g: 0 };
      const s = box.bat[id], t = bat[id];
      ['pa', 'ab', 'r', 'h', 'd2', 'd3', 'hr', 'rbi', 'bb', 'k', 'sb', 'ob'].forEach(k => t[k] += s[k]);
      t.g += 1;
    });
    Object.keys(box.pit).forEach(id => {
      if (!pit[id]) pit[id] = { bf: 0, outs: 0, r: 0, k: 0, g: 0 };
      const s = box.pit[id], t = pit[id];
      ['bf', 'outs', 'r', 'k'].forEach(k => t[k] += s[k]);
      t.g += 1;
    });
  };
  const collect = (gm) => { if (gm && gm.played && gm.result) { addGame(gm.result.boxHome); addGame(gm.result.boxAway); } };
  league.schedule.forEach(collect);
  if (league.playoffs) {
    collect(league.playoffs.playin);
    league.playoffs.final.games.forEach(collect);
  }
  return { bat, pit };
}

// A save from an older build can reference players that no longer exist in the DB (we trim the
// roster of players between versions). Restoring one would crash on render, so validate first.

  if (typeof obj === 'string') { if (/^(p\d+|gen_\d+|g\d+)$/.test(obj)) out.push(obj); return out; }
  if (Array.isArray(obj)) { obj.forEach(v => collectIds(v, out)); return out; }
  if (typeof obj === 'object') { Object.keys(obj).forEach(k => collectIds(obj[k], out)); return out; }
  return out;

function saveIsCompatible(s) {
  if (!s || !s.phase) return false;
  if (s.saveVersion !== SAVE_VERSION) return false;   // built against a different DB/roster shape
  // every referenced player must resolve (generics are re-registered at load, so allow gen_/g ids)
  const ids = collectIds(s, []);
  for (const id of ids) {
    if (!byId[id]) return false;   // a player (real or generic) this save needs no longer exists
  }
  return true;
}
// Saved franchises reference generic players that only live in memory. Restore them from the
// registry saved alongside the state, so byId lookups resolve after a reload.
function rehydrateGenerics(s) {

    Object.keys(s.generics).forEach(id => {
      const g = s.generics[id];
      if (g && g.id) { byId[id] = g; GEN_REG[id] = g; }
    });
    // make sure newly minted generics can't collide with loaded ones
    let maxN = -1;
    Object.keys(s.generics).forEach(id => {

      if (m) maxN = Math.max(maxN, parseInt(m[1], 10));

    if (maxN >= 0 && _genSeq <= maxN) _genSeq = maxN + 1;
  }
  return s;
}


// ================= LADDER MODE (roguelike) =================
// Start with 17 zero-star generics. Five series against progressively better teams.
// Win a series -> draft 3 of 5 players of that tier + a token bonus. Lose one -> the run is over.
const LADDER_LEVELS = [
  { lvl: 1, oppStar: 0, bestOf: 1, need: 1, perWin: 2,  bonus: 20, reward: 1, name: 'Sandlot' },
  { lvl: 2, oppStar: 1, bestOf: 3, need: 2, perWin: 5,  bonus: 40, reward: 2, name: 'Single-A' },
  { lvl: 3, oppStar: 2, bestOf: 5, need: 3, perWin: 10, bonus: 60, reward: 3, name: 'Double-A' },
  { lvl: 4, oppStar: 3, bestOf: 7, need: 4, perWin: 15, bonus: 80, reward: 4, name: 'Triple-A' },
  { lvl: 5, oppStar: 4, bestOf: 7, need: 4, perWin: 25, bonus: 0,  reward: 0, name: 'The Show' },
];
const LADDER_START_TOKENS = 6;
// Three pack tiers. Weights are 1★/2★/3★/4★ chances (normalised).
const PACKS = [
  { key: 'bronze', name: 'Bronze pack', price: 3,  color: '#B08D57', weights: [64, 28, 8,  0]  },
  { key: 'silver', name: 'Silver pack', price: 10, color: '#B8C1CC', weights: [10, 55, 33, 2]  },
  { key: 'gold',   name: 'Gold pack',   price: 25, color: '#F2A93B', weights: [0,  22, 63, 15] },
];
// Cost to raise a player FROM this star to the next. 5★ is boost-only.
const BOOST_PRICES = { 1: 3, 2: 10, 3: 20, 4: 40 };
const SHOP_PRICES = { 1: 1, 2: 5, 3: 20, 4: 30 };
const PACK_PRICE = 3;
const LADDER_ROSTER = { B: 11, SP: 3, RP: 3 };   // 17

function ladderStarMatch(p, star) { return star >= 4 ? (p.stars >= 4) : p.stars === star; }
function isLegend(p) { return !!p && p.team === 'LEG'; }

// carried on the ladder as L.legendPool (an array of ids). `legends` is either that array, or the
// string 'only' when building The Show's all-legend roster.
function poolByStar(star, type, legends) {
  const base = DB.filter(p => ladderStarMatch(p, star) && (type === 'ANY' ? true : type === 'B' ? p.type === 'B' : p.type === type));
  if (legends === 'only') return base.filter(isLegend);
  const allow = Array.isArray(legends) ? legends : [];
  return base.filter(p => !isLegend(p) || allow.indexOf(p.id) >= 0);
}
function randPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// A fresh all-generic 17-man roster.
function ladderStartRoster() {
  const ids = [];
  const posPlan = ['C', '1B', '2B', 'SS', '3B', 'CO', 'CO', 'CF', 'UT', 'C', '1B'];  // 11 bats
  posPlan.forEach(pos => { const g = makeGeneric('B', pos); registerGeneric(g); ids.push(g.id); });
  for (let i = 0; i < 3; i++) { const g = makeGeneric('SP'); registerGeneric(g); ids.push(g.id); }
  for (let i = 0; i < 3; i++) { const g = makeGeneric('RP'); registerGeneric(g); ids.push(g.id); }
  return ids;
}

// Opponent for a level: a full roster of that star class.
// Star 0 = generics. For 4-star, the DB is short (10 bats / 1 RP) so we top up from 3-star.
function makeLadderOpponent(level) {
  const cfg = LADDER_LEVELS[level - 1];
  const s = cfg.oppStar;
  const LEG = level >= 5 ? 'only' : [];   // The Show fields an all-legend club
  const ids = [];
  if (s === 0) {
    return { name: 'The Sandlot', color: '#8A959E', roster: ladderStartRoster(), idx: 1, fatigue: {}, heat: {}, appeared: { pit: {}, bat: {} } };
  }
  const take = (want, type, star) => {
    const out = [];
    let pool = poolByStar(star, type, LEG).slice();
    while (out.length < want) {
      if (pool.length === 0) {                       // tier exhausted -> top up from one tier down
        pool = poolByStar(star - 1, type, LEG).filter(p => !out.includes(p.id));
        if (pool.length === 0) break;
      }
      const p = randPick(pool);
      pool = pool.filter(x => x.id !== p.id);
      out.push(p.id);
    }
    return out;
  };
  // Position-aware batter draft: ensure the opponent can actually field every spot (no Alonso in CF).
  // Fill each field position with a random ELIGIBLE player of the tier, then top up to 11.
  const takeBatsByPosition = (star) => {
    const need = ['C', '1B', '2B', 'SS', '3B', 'CF', 'LF', 'RF'];  // 8 field spots
    const chosen = [];
    const chosenSet = new Set();
    const eligiblePool = (spot, st) => poolByStar(st, 'B', LEG).filter(p =>
      !chosenSet.has(p.id) && eligibility(p, spot) !== null);
    need.forEach(spot => {
      let pool = eligiblePool(spot, star);
      let st = star;
      while (pool.length === 0 && st > 0 && LEG !== 'only') { st--; pool = eligiblePool(spot, st); }
      if (pool.length === 0) return;   // truly nobody — will be topped up below
      // prefer a NATURAL fit, else a backup, else out-of-position
      const natural = pool.filter(p => eligibility(p, spot) === 'ok');
      const backup = pool.filter(p => eligibility(p, spot) === 'bkp');
      const p = randPick(natural.length ? natural : backup.length ? backup : pool);
      chosen.push(p.id); chosenSet.add(p.id);
    });
    // top up to 11 batters with any random players of the tier (bench / DH)
    let fill = star;
    while (chosen.filter(id => byId[id] && !byId[id].twP).length < LADDER_ROSTER.B) {
      let pool = poolByStar(fill, 'B', LEG).filter(p => !chosenSet.has(p.id));
      if (pool.length === 0) { if (fill <= 0 || LEG === 'only') break; fill--; continue; }
      const p = randPick(pool);
      chosen.push(p.id); chosenSet.add(p.id);
    }
    return chosen;
  };
  const batIds = takeBatsByPosition(s);
  // a two-way batter already occupies a starter slot, so fill fewer real SPs
  const twoWayBats = batIds.filter(id => byId[id] && byId[id].twP).length;
  ids.push(...batIds);
  ids.push(...take(Math.max(0, LADDER_ROSTER.SP - twoWayBats), 'SP', s));
  ids.push(...take(LADDER_ROSTER.RP, 'RP', s));
  // opponent named after the level's tier (Single-A club, etc.); star 0 handled at the top
  const TIER_CLUBS = { 1: 'The Single-A Club', 2: 'The Double-A Club', 3: 'The Triple-A Club', 4: 'The Big-League Club' };
  if (level >= 5) return { name: 'The Show', color: '#F2A93B', roster: ids, idx: 1, fatigue: {}, heat: {}, appeared: { pit: {}, bat: {} } };
  const COLORS = { 1: '#5FA88F', 2: '#457B9D', 3: '#F2A93B', 4: '#E63946' };
  return { name: TIER_CLUBS[s] || (s + '★ Club'), color: COLORS[s], roster: ids, idx: 1, fatigue: {}, heat: {}, appeared: { pit: {}, bat: {} } };
}


// ---------- STAR BOOSTS ----------
// Raise a player one star. Batters pick 2 batting stats + 1 fielding stat; pitchers pick 1 stat
// (2 when going 2★->3★, matching the natural gap between those tiers). Caps lift at 5★.
function boostCap(newStars, kind) {

}
function boostPicks(p, curStars) {

    const room = ['pow', 'con', 'onb'].filter(k => (p[k] || 0) < cap).length;
    const stats = Math.min(2, room);          // can't raise a hitting stat that's already capped
    return { stats, field: 3 - stats };       // leftover points go into SPD/DEF/ARM
  }

}

// Build the upgraded player (a fresh registered id) and swap him into the ladder roster,

function applyBoost(L, pid, picks) {

  const np = Object.assign({}, p, { id: 'bst_' + pid + '_' + ns + '_' + (_genSeq++), stars: ns, boostedFrom: pid });
  const kind = p.type === 'B' ? 'bat' : 'pit';
  (picks.stats || []).forEach(k => { np[k] = Math.min(boostCap(ns, kind), (np[k] || 0) + 1); });
  (picks.field || []).forEach(k => { np[k] = (np[k] || 0) + 1; });
  registerGeneric(np);
  // a boosted two-way needs his arm rebuilt under the new id
  if (np.twP) {
    const oldArm = byId[pid + '_P'];
    const arm = Object.assign({}, oldArm || {}, { id: np.id + '_P', stars: ns, twoWayOf: np.id });
    registerGeneric(arm);
    TWOWAY_ARM[np.id] = arm.id;
    if (L.fatigue && L.fatigue[pid + '_P'] != null) { L.fatigue[arm.id] = L.fatigue[pid + '_P']; delete L.fatigue[pid + '_P']; }
  }
  const i = L.roster.indexOf(pid);
  if (i >= 0) L.roster[i] = np.id; else L.roster.push(np.id);
  if (L.heat && L.heat[pid] != null) { L.heat[np.id] = L.heat[pid]; delete L.heat[pid]; }        // keeps his heat
  if (L.fatigue && L.fatigue[pid] != null) { L.fatigue[np.id] = L.fatigue[pid]; delete L.fatigue[pid]; }
  return np;
}

// Shop: one random player of each star, plus a 2-player pack. Re-rolled between games.
// Each completed round shaves the level number off that series' bonus (L1 -1, L2 -2, L3 -3, L4 -4).
function seriesBonus(L, cfg) { return Math.max(0, cfg.bonus - cfg.lvl * ((L.round || 1) - 1)); }
function rollShop(ownedIds, legendPool) {
  const owned = new Set(ownedIds);
  const slots = [1, 2, 3].map(star => {   // 4★ is pack-only
    const pool = poolByStar(star, 'ANY', legendPool || []).filter(p => !owned.has(p.id));
    const p = pool.length ? randPick(pool) : null;
    return { star, id: p ? p.id : null, price: SHOP_PRICES[star] };
  });
  return { slots, packPrice: PACK_PRICE };
}
// Pull 2 players using a pack's star weights.
function weightedStar(weights) {
  const tot = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * tot;
  for (let i = 0; i < weights.length; i++) { r -= weights[i]; if (r <= 0) return i + 1; }
  return weights.length;
}
function packPull(ownedIds, packKey, legendPool) {
  const pack = PACKS.find(p => p.key === packKey) || PACKS[0];
  const owned = new Set(ownedIds);
  const LEGP = legendPool || [];
  const out = [];
  let guard = 0;
  while (out.length < 2 && guard < 300) {
    guard++;
    const star = weightedStar(pack.weights);
    let pool = poolByStar(star, 'ANY', LEGP).filter(p => !owned.has(p.id) && !out.includes(p.id));
    if (!pool.length) {   // that tier is tapped out — drop a tier rather than fail
      pool = poolByStar(Math.max(1, star - 1), 'ANY', LEGP).filter(p => !owned.has(p.id) && !out.includes(p.id));
    }
    if (!pool.length) continue;
    out.push(randPick(pool).id);
  }
  return out;
}

// The five fixed players offered at the start of a ladder run — pick 3 of 5.
const LADDER_START_PICKS = ['H. Kjerstad', 'Y. Cano', 'D. Kremer', 'C. Mayo', 'C. Cowser'];
const LADDER_S2_TOKENS = 20;   // granted on arrival at series 2 (after winning the opener)
function makeLadder() {
  const roster = ladderStartRoster();
  const startChoices = LADDER_START_PICKS.map(nm => DB.find(p => p.name === nm)).filter(Boolean).map(p => p.id);
  return {
    level: 1, tokens: 0, roster,
    fatigue: {}, heat: {}, appeared: { pit: {}, bat: {} },
    series: { wins: 0, losses: 0, games: [] },
    opponent: makeLadderOpponent(1),
    shop: rollShop(roster, []),
    pending: [],          // players acquired, awaiting a cut down to 17
    allTime: { bat: {}, pit: {}, games: 0 },   // your club's running stats across the whole run
    startDraft: { choices: startChoices, take: 3 },   // pick 3 of 5 to open the run
    s2Granted: false,     // have we handed out the series-2 token stipend yet?
    round: 1,             // which lap of the ladder you're on
    roundsWon: 0,         // completed laps
    legendPool: [],       // legends unlocked for acquisition (one per completed round)
    boosts: 0,            // banked star-boost credits
    over: false, won: false, log: [],
  };
}
function ladderUserTeam(L) {
  return { name: 'Your Club', color: '#F2A93B', roster: L.roster, idx: 0,
           fatigue: L.fatigue, heat: L.heat, appeared: L.appeared };
}
function ladderCfg(L) { return LADDER_LEVELS[L.level - 1]; }

// Fatigue/heat persist across the whole run, but they must RECOVER between games or the staff
// is dead by level 5. Same model as the league's between-days rest.
function ladderRest(L) {
  const clk = L.fatigue || {}, heat = L.heat || {}, app = L.appeared || { pit: {}, bat: {} };
  const nc = {}, nh = {};
  Object.keys(clk).forEach(pid => { nc[pid] = towardZero(clk[pid], app.pit[pid] ? 1 : 2); });
  Object.keys(heat).forEach(pid => { nh[pid] = app.bat[pid] ? heat[pid] : towardZero(heat[pid], 2); });
  L.fatigue = nc; L.heat = nh; L.appeared = { pit: {}, bat: {} };
  // the opposing club rests too
  const o = L.opponent;
  if (o) {
    const oc = o.fatigue || {}, oh = o.heat || {}, oa = o.appeared || { pit: {}, bat: {} };
    const c2 = {}, h2 = {};
    Object.keys(oc).forEach(pid => { c2[pid] = towardZero(oc[pid], oa.pit[pid] ? 1 : 2); });
    Object.keys(oh).forEach(pid => { h2[pid] = oa.bat[pid] ? oh[pid] : towardZero(oh[pid], 2); });
    o.fatigue = c2; o.heat = h2; o.appeared = { pit: {}, bat: {} };
  }
  return L;
}

// Record a finished game; advance the series / level / run.
// Accumulate the USER club's box-score line into the run's all-time totals.
function mergeLadderAllTime(L, res, userIsHome) {
  if (!L.allTime) L.allTime = { bat: {}, pit: {}, games: 0 };
  const box = userIsHome ? res.boxHome : res.boxAway;
  if (!box) return;
  Object.keys(box.bat).forEach(id => {
    if (!byId[id]) return;
    if (!L.allTime.bat[id]) L.allTime.bat[id] = BAT_KEYS.reduce((o,k)=>(o[k]=0,o), {});
    BAT_KEYS.forEach(k => { if (k !== 'g') L.allTime.bat[id][k] += (box.bat[id][k] || 0); });
    L.allTime.bat[id].g += 1;   // appeared this game
  });
  Object.keys(box.pit).forEach(id => {
    if (!byId[id]) return;
    if (!L.allTime.pit[id]) L.allTime.pit[id] = PIT_KEYS.reduce((o,k)=>(o[k]=0,o), {});
    PIT_KEYS.forEach(k => { if (k !== 'g') L.allTime.pit[id][k] += (box.pit[id][k] || 0); });
    L.allTime.pit[id].g += 1;
  });
  L.allTime.games++;
}
function ladderRecord(L, res, userIsHome) {
  const cfg = ladderCfg(L);
  mergeLadderAllTime(L, res, userIsHome);
  const userScore = userIsHome ? res.homeScore : res.awayScore;
  const oppScore = userIsHome ? res.awayScore : res.homeScore;
  const won = userScore > oppScore;
  L.series.games.push({ us: userScore, them: oppScore, won });
  if (won) {
    L.series.wins++;
    L.tokens += cfg.perWin;
    L.log.push(`Won ${userScore}-${oppScore} (+${cfg.perWin} tokens)`);
  } else {
    L.series.losses++;
    L.log.push(`Lost ${oppScore}-${userScore}`);
  }
  ladderRest(L);          // rest between games (both clubs)
  if (L.series.wins >= cfg.need) {
    // series won — every completed round shaves 2 off each series bonus (cumulative)
    const bonus = seriesBonus(L, cfg);
    L.tokens += bonus;
    L.log.push(`SERIES WON — +${bonus} token bonus`);
    const lastLevel = L.level >= LADDER_LEVELS.length;
    // Clearing Triple-A pays in star boosts (4★ players are pack-only). Once you've unlocked legends
    // by completing rounds, you may take any mix of those legends and boosts — 3 items combined.
    if (cfg.reward >= 4 && !lastLevel) {
      const legs = (L.legendPool || []).filter(id => byId[id] &&
        !L.roster.includes(id) && !L.pending.includes(id));
      if (legs.length) {
        L.rewardDraft = { star: 4, choices: legs.concat(['__boost:0', '__boost:1', '__boost:2']), take: 3, mixed: true };
      } else {
        L.boosts = (L.boosts || 0) + 3;
        L.log.push('SERIES REWARD — 3 star boosts');
      }
    } else if (cfg.reward > 0 && !lastLevel) {
      // offer a draft: pick 3 from 5 random players of the reward tier (never legends)
      const pool = poolByStar(cfg.reward, 'ANY', L.legendPool || []).filter(p =>
        !L.roster.includes(p.id) && !L.pending.includes(p.id));
      const picks = [];
      const bag = pool.slice();
      for (let i = 0; i < 5 && bag.length; i++) {
        const idx = Math.floor(Math.random() * bag.length);
        picks.push(bag.splice(idx, 1)[0].id);
      }
      if (picks.length > 0) {
        L.rewardDraft = { star: cfg.reward, choices: picks, take: Math.min(3, picks.length) };
      } else {
        L.log.push(`No new ${cfg.reward}★ players available.`);
      }
    }
    if (lastLevel) {
      // Round complete. Bonuses shrink by 2 more, one legend joins the pullable pool, and you start
      // over from the sandlot with a fresh 17 (no roster carryover).
      L.round = (L.round || 1) + 1;
      L.roundsWon = (L.roundsWon || 0) + 1;
      const locked = DB.filter(p => isLegend(p) && (L.legendPool || []).indexOf(p.id) < 0);
      if (locked.length) {
        const add = randPick(locked);
        L.legendPool = (L.legendPool || []).concat([add.id]);
        L.log.push(`ROUND ${L.roundsWon} COMPLETE — ${add.name} joins the player pool`);
      } else {
        L.log.push(`ROUND ${L.roundsWon} COMPLETE — every legend is already in the pool`);
      }
      L.level = 1;
      L.series = { wins: 0, losses: 0, games: [] };
      L.roster = ladderStartRoster();     // no carryover
      L.pending = []; L.boosts = 0;
      L.tokens = 0; L.s2Granted = false;
      L.fatigue = {}; L.heat = {}; L.appeared = { pit: {}, bat: {} };
      L.opponent = makeLadderOpponent(1);
      L.startDraft = { choices: LADDER_START_PICKS.map(nm => DB.find(q => q.name === nm)).filter(Boolean).map(q => q.id), take: 3 };
      L.shop = rollShop(L.roster, L.legendPool || []);
      L.log.push(`Round ${L.round} begins — series bonuses scaled down by level`);
      return L;
    }
    L.level++;
    L.series = { wins: 0, losses: 0, games: [] };
    L.opponent = makeLadderOpponent(L.level);
    // On first arrival at series 2, your bankroll is SET to the opening stipend (it does not stack on the
    // L1 game/series winnings). You start a run at 0 with no shop before game 1, so this seeds series 2 at 20.
    if (L.level === 2 && !L.s2Granted) {
      L.tokens = LADDER_S2_TOKENS;
      L.s2Granted = true;
      L.log.push(`Series 2 — ${LADDER_S2_TOKENS} tokens to build your club`);
    }
  } else if (L.series.losses > cfg.bestOf - cfg.need) {
    L.over = true; L.won = false;
    L.log.push('SERIES LOST — run over');
    return L;
  }
  L.shop = rollShop(L.roster.concat(L.pending), L.legendPool || []);
  return L;
}
function ladderBuy(L, star) {
  const slot = L.shop.slots.find(s => s.star === star);
  if (!slot || !slot.id || L.tokens < slot.price) return L;
  L.tokens -= slot.price;
  L.pending.push(slot.id);
  L.lastPack = [slot.id];
  slot.id = null;   // sold out until the shop re-rolls after the next game
  return L;
}
function ladderBuyPack(L, packKey) {
  const pack = PACKS.find(p => p.key === packKey);
  if (!pack || L.tokens < pack.price) return L;
  L.tokens -= pack.price;
  const pulled = packPull(L.roster.concat(L.pending), pack.key, L.legendPool || []);
  pulled.forEach(id => L.pending.push(id));
  L.lastPack = pulled;   // remembered for the reveal popup
  return L;
}
// legality: exactly 11 B / 3 SP / 3 RP
function ladderRosterLegal(ids) {
  const s = rosterSlots(ids);
  return s.B === LADDER_ROSTER.B && s.SP === LADDER_ROSTER.SP && s.RP === LADDER_ROSTER.RP;
}

// ---------- STORAGE ----------
async function storageSet(key, value) {
  try { localStorage.setItem(key, value); return true; } catch (e) {}
  if (typeof window !== 'undefined' && window.storage) {
    const r = await window.storage.set(key, value, false);
    if (r) return true;
    const check = await window.storage.get(key, false);
    if (check && check.value === value) return true;
    throw new Error('save failed');
  }
  throw new Error('no storage available');
}
async function storageGet(key) {
  try { const v = localStorage.getItem(key); if (v !== null) return v; return null; } catch (e) {}
  if (typeof window !== 'undefined' && window.storage) {
    try { const r = await window.storage.get(key, false); return r && r.value ? r.value : null; } catch { return null; }
  }
  return null;
}

// ---------- POSITIONS EDITOR ----------
function PositionsEditor({ team, onApply, onClose }) {
  const active = team.order;
  const init = {};
  active.forEach(pid => {
    let spot = 'DH';
    ALL_SPOTS.forEach(s => { if (team.positions[s] === pid) spot = s; });
    init[pid] = spot;
  });
  const [assign, setAssign] = useState(init);
  const spots = [...ALL_SPOTS, 'DH'];
  const counts = {};
  spots.forEach(s => counts[s] = 0);
  Object.values(assign).forEach(s => counts[s]++);
  const valid = spots.every(s => counts[s] === 1) &&
    active.every(pid => assign[pid] === 'DH' || eligibility(byId[pid], assign[pid]) !== null);
  return (
    <div style={{ ...CARD, border: '1px solid #F2A93B66' }}>
      <div style={{ ...LABEL, marginBottom: 8 }}>Set positions — {team.name}</div>
      {active.map(pid => {
        const p = byId[pid];
        const cur = assign[pid];
        const elig = cur === 'DH' ? 'ok' : eligibility(p, cur);
        return (
          <div key={pid} style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 5 }}>
            <div style={{ fontSize: 12, flex: 1 }}>{p.name} <span style={{ color: '#5b6870', fontSize: 10 }}>{p.pos}{p.pos2 ? <span style={{ color: '#5FA88F' }}>/{p.pos2}</span> : null}</span></div>
            <select value={cur} onChange={e => setAssign(a => ({ ...a, [pid]: e.target.value }))}
              style={{ background: '#111417', color: '#EDEDE3', border: '1px solid #2A3138', borderRadius: 6, fontSize: 12, padding: '3px 4px' }}>
              {spots.map(s => {
                const el = s === 'DH' ? 'ok' : eligibility(p, s);
                if (el === null) return null;
                return <option key={s} value={s}>{s}{el === 'pen' ? ' (−1)' : ''}</option>;
              })}
            </select>
            <span style={{ fontSize: 10, width: 30, color: elig === 'pen' ? '#E63946' : counts[cur] > 1 ? '#E63946' : '#5FA88F' }}>
              {counts[cur] > 1 ? 'dup' : elig === 'pen' ? '−1' : 'ok'}
            </span>
          </div>
        );
      })}
      <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
        <button disabled={!valid} onClick={() => {
          const positions = {};
          Object.entries(assign).forEach(([pid, s]) => { if (s !== 'DH') positions[s] = pid; });
          const dh = active.find(pid => assign[pid] === 'DH');
          onApply(positions, dh);
        }} style={{ ...BTN, flex: 1, padding: '9px 0', background: valid ? '#F2A93B' : '#2A3138', color: valid ? '#111417' : '#5b6870', fontWeight: 700, border: 'none' }}>
          Apply
        </button>
        <button onClick={onClose} style={{ ...BTN, flex: 1, padding: '9px 0' }}>Cancel</button>
      </div>
    </div>
  );
}

function pScore(p) { return p.type === 'B' ? 3 * (p.pow + p.con + p.onb) + p.spd + p.def + p.arm : p.pow + p.ctl + p.chg; }
