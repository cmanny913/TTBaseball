      r.roster = r.roster.slice();                    // keep current roster
      r.picks = null;                                 // so finalize bases off carried roster, not draft
      r.swaps = [];
    });
    // grant new randoms by finish (worse teams get more: 4/5/6/8)
    grantSeasonRandoms(lg, standings);
    lg.rosters.forEach(r => { if (!r.randoms) r.randoms = []; });
    lg.season = (lg.season || 1) + 1;
    lg.schedule = makeSchedule();
    lg.playoffs = null;
    lg.activeDay = null;
    lg.movesSeen = false;
    ns.phase = 'randoms';                              // reuse the randoms-claim screen
    ns.seasonRollover = true;                          // flag: randoms came from a season, not draft
  });
  const poGame = (po, tag) => tag === 'playin' ? po.playin : po.final.games[parseInt(tag.split(':')[1])];
  const simPO = (tag) => mut(ns => {
    const po = ns.league.playoffs;
    const gm = poGame(po, tag);
    const res = simLeagueGame(ns.league.rosters[gm.home], ns.league.rosters[gm.away]);
    if (tag === 'playin') advancePlayin(po, res); else advanceFinal(po, parseInt(tag.split(':')[1]), res);
  });
  const playPO = (tag) => mut(ns => { ns.phase = 'pregame'; ns.pendingPO = tag; });
  const startPOGame = (spId, plan) => setState(s => {
    const ns = JSON.parse(JSON.stringify(s));
    const po = ns.league.playoffs;
    const gm = ns.pendingPO === 'playin' ? po.playin : po.final.games[parseInt(ns.pendingPO.split(':')[1])];
    const myIdx = ns.league.userIdx;
    const fH = gm.home === myIdx ? spId : null;
    const fA = gm.away === myIdx ? spId : null;
    const homeT = teamFromRoster(ns.league.rosters[gm.home], fH, gm.home === myIdx ? plan : null);
    const awayT = teamFromRoster(ns.league.rosters[gm.away], fA, gm.away === myIdx ? plan : null);
    const g = freshGame(homeT, awayT);
    g.userControls = gm.home === myIdx ? 'home' : 'away';
    g.log = ['Playoff game: ' + awayT.name + ' @ ' + homeT.name + '.'];
    ns.game = g;
    ns.phase = 'leagueplay';
    return ns;
  });
  const finishPOGame = () => mut(ns => {
    const g = ns.game;
    const po = ns.league.playoffs;
    const tag = ns.pendingPO;
    const res = { home: 0, away: 0, homeScore: g.score.home, awayScore: g.score.away, innings: g.inning, boxHome: extractBox(g.teams.home), boxAway: extractBox(g.teams.away), played: true };
    if (tag === 'playin') advancePlayin(po, res); else advanceFinal(po, parseInt(tag.split(':')[1]), res);
    ns.game = null;
    ns.pendingPO = null;
    ns.phase = 'playoffs';
  });

  // ----- PLAY PHASE helpers -----
  const g = state.game;
  const inPlay = (state.phase === 'play' || state.phase === 'leagueplay' || state.phase === 'ladderplay') && g;

  const forcedSPDone = inPlay && !g.over && (() => {
    const ft = fldTeam(g); const p = byId[ft.curP];
    return p.type === 'SP' && ft.pitState[p.id].fatigue >= 5;
  })();
  const availableRelief = inPlay ? (() => {
    const ft = fldTeam(g);
    return ft.rps.filter(pid => pid !== ft.curP && !ft.removed.includes(pid));
  })() : [];

  const aiHandleForcedSub = (ns) => {
    // only auto-manage the side the user is NOT controlling
    const gg = ns.game;
    const fs = fieldingSide(gg);
    if (gg.userControls === fs || gg.userControls === 'both') return;
    aiManagePitching(gg);
  };

  const pitch = () => {
    if (!inPlay || g.over || g.advQueue.length > 0) return;
    if (forcedSPDone && (g.userControls === fieldingSide(g) || g.userControls === 'both')) {
      flash('Your starter is done — make a pitching change.'); return;
    }
    mut(ns => {
      const gg = ns.game;
      aiHandleForcedSub(ns);   // safety net; normally already declared before the die pick
      const batter = currentBatter(gg);
      const bt = batTeam(gg); const ft = fldTeam(gg);
      const bEffAll = batEff(batter, bt.batHeat[batter.id] || 0);
      const side = battingSide(gg);
      const userBats = gg.userControls === side || gg.userControls === 'both';
      const userFields = gg.userControls === fieldingSide(gg) || gg.userControls === 'both';
      // AI steal
      if (!userBats) {
        for (const b of [1, 0]) {
          if (gg.bases[b] && !gg.bases[b + 1] && gg.bases[b].spd >= 3 && Math.random() < 0.15) {
            attemptSteal(gg, b);
            if (gg.over || gg.outs === 0) return;
            break;
          }
        }
      }
      // AI IBB
      if (!userFields && !gg.bases[0] && (gg.bases[1] || gg.bases[2]) && bEffAll.pow >= 8 && gg.outs < 2 && Math.random() < 0.25) {
        issueIBB(gg); return;
      }
      let bColor, pColor;
      if (userBats) { bColor = myDie || aiBatterDie(gg, bEffAll); pColor = aiPitcherDie(gg, bEffAll); }
      else if (userFields) { pColor = myDie || aiPitcherDie(gg, bEffAll); bColor = aiBatterDie(gg, bEffAll); }
      else { pColor = aiPitcherDie(gg, bEffAll); bColor = aiBatterDie(gg, bEffAll); }
      // mark RP as having pitched this inning
      const curP = byId[ft.curP];
      ft.pitState[curP.id].startedThisInning = true;
      resolveAtBat(gg, pColor, bColor);
    });
    setMyDie(null);
  };

  // Play the remainder of the game out with the AI, to a genuine finish (not a forfeit).
  const simGame = () => mut(ns => {
    const gg = ns.game;
    let guard = 0;
    // "Sim to end" hands the rest of the game to the AI — including any decisions the user
    // would normally own, so they must all resolve (otherwise the queue jams and the inning
    // never ends). Force AI control for the duration of the sim.
    const savedControls = gg.userControls;
    gg.userControls = 'none';
    drainDecisionsAI(gg);
    if (gg.advQueue.length === 0) maybeEndHalf(gg);
    while (!gg.over && guard < 4000) {
      aiHandleForcedSub(ns);
      aiManagePitching(gg);
      aiMaybeSteal(gg);
      if (gg.over) break;
      const batter = currentBatter(gg);
      const bt = batTeam(gg); const ft = fldTeam(gg);
      const bEffAll = batEff(batter, bt.batHeat[batter.id] || 0);
      if (ft.pitState[ft.curP]) ft.pitState[ft.curP].startedThisInning = true;
      resolveAtBat(gg, aiPitcherDie(gg, bEffAll), aiBatterDie(gg, bEffAll));
      drainDecisionsAI(gg);
      if (gg.advQueue.length === 0) maybeEndHalf(gg);
      guard++;
    }
    gg.userControls = savedControls;
    if (gg.over) finishGame(gg);   // idempotent (guarded by finalProcessed)
  });

  const simHalf = () => mut(ns => {
    const gg = ns.game;
    let guard = 0;
    const sh = gg.half, si = gg.inning;
    const savedControls = gg.userControls;
    gg.userControls = 'none';   // AI resolves all decisions so the half can't jam
    drainDecisionsAI(gg);
    if (gg.advQueue.length === 0) maybeEndHalf(gg);
    while (!gg.over && gg.half === sh && gg.inning === si && guard < 70) {
      aiHandleForcedSub(ns);
      const batter = currentBatter(gg);
      const bt = batTeam(gg); const ft = fldTeam(gg);
      const bEffAll = batEff(batter, bt.batHeat[batter.id] || 0);
      const curP = byId[ft.curP];
      ft.pitState[curP.id].startedThisInning = true;
      resolveAtBat(gg, aiPitcherDie(gg, bEffAll), aiBatterDie(gg, bEffAll));
      drainDecisionsAI(gg);
      if (gg.advQueue.length === 0) maybeEndHalf(gg);
      guard++;
    }
    gg.userControls = savedControls;
  });

  const S_ROW = { display: 'flex', gap: 8, marginBottom: 10 };

  // ================= RENDER =================
  return (
    <div style={{ minHeight: '100vh', background: '#111417', color: '#EDEDE3',
      fontFamily: "'Segoe UI', system-ui, sans-serif", padding: 12, maxWidth: 560, margin: '0 auto', boxSizing: 'border-box' }}>
      <style>{`* { box-sizing: border-box; } button:focus-visible { outline: 2px solid #E63946; }`}</style>

      {['draft','randoms','season','playoffs'].includes(state.phase) ? (
        <div style={{ display: 'flex', gap: 5, marginBottom: 10, alignItems: 'center' }}>
          <div style={{ fontFamily: 'Georgia, serif', fontWeight: 800, fontSize: 18, color: '#F2A93B', flex: 1 }}>{state.phase === 'draft' ? 'Draft' : String(state.phase).indexOf('ladder') === 0 ? ('Ladder · Lv ' + (state.ladder ? state.ladder.level : 1)) : state.phase === 'season' ? ('Season ' + (state.league ? (state.league.season || 1) : 1)) : state.phase === 'playoffs' ? 'Playoffs' : 'Franchise'}</div>
          <button onClick={state.phase === 'draft' ? draftExit : String(state.phase).indexOf('ladder') === 0 ? ladderQuit : leagueExit} style={{ ...BTN, padding: '6px 10px', fontSize: 11, color: '#8A959E' }}>Exit</button>
        </div>
      ) : (String(state.phase).indexOf('ladder') === 0 && !inPlay) ? null : (
        <div style={{ display: 'flex', gap: 5, marginBottom: 10, overflowX: 'auto' }}>
          {(inPlay
            ? [['game', 'Game'], ['team', 'Teams'], ['box', 'Box'], ['rules', 'Rules']]
            : [['game', 'Game'], ['players', 'Players'], ['rules', 'Rules']]
          ).map(([t, lbl]) => (
            <button key={t} onClick={() => setTab(t)} style={{ ...BTN, flex: 1, padding: '8px 0', fontSize: 13,
              background: tab === t ? '#2A3138' : '#1A1F24', fontWeight: tab === t ? 700 : 400 }}>{lbl}</button>
          ))}
        </div>
      )}

      {state.phase === 'ladder' ? (
        (state.ladder.startDraft)
          ? <LadderStartDraft L={state.ladder} onConfirm={ladderStartDraftConfirm} />
          : (state.ladder.rewardDraft)
          ? <LadderReward L={state.ladder} onConfirm={ladderRewardConfirm} />
          : <LadderHub L={state.ladder} onPlay={ladderPlay} onBuy={ladderShop} onPack={ladderPack} onBoost={ladderBoost}
              onCut={ladderOpenCut} onReveal={ladderReveal} onQuit={ladderQuit} />
      ) : state.phase === 'laddercut' ? (
        <LadderCut L={state.ladder} onConfirm={ladderConfirmCut} />
      ) : state.phase === 'ladderpregame' ? (
        <PregameScreen
          league={{ rosters: [ladderUserTeam(state.ladder), state.ladder.opponent], userIdx: 0, season: state.ladder.level }}
          gameIdx={state.ladder.series.games.length}
          gm={{ home: state.ladder.series.games.length % 2 === 0 ? 0 : 1,
                away: state.ladder.series.games.length % 2 === 0 ? 1 : 0, day: 1 }}
          onStart={ladderStartGame} />
      ) : state.phase === 'draft' ? (
         <DraftRoom ds={state.draft} onPick={draftPick} onSim={draftSim} onAuto={draftAuto} onFinish={draftFinish} />
       ) :
       state.phase === 'randoms' ? (
         <RandomsPhase ds={state.seasonRollover ? state.league : state.draft} onCommit={commitRoster} />
       ) :
       state.phase === 'season' ? (
         <SeasonHub league={state.league} onSimGame={simGameIdx} onSimAll={simAll} onPlayGame={playGameIdx} onOpenPlayoffs={openPlayoffs} onDismissMoves={dismissMoves} />
       ) :
       state.phase === 'pregame' ? (
         <PregameScreen league={state.league}
           gameIdx={state.pendingGameIdx != null ? state.pendingGameIdx : 0}
           gm={state.pendingPO ? (state.pendingPO === 'playin' ? state.league.playoffs.playin : state.league.playoffs.final.games[parseInt(state.pendingPO.split(':')[1])]) : null}
           onStart={state.pendingPO ? startPOGame : startLeagueGame} />
       ) :
       state.phase === 'playoffs' ? (
         <PlayoffsScreen league={state.league} po={state.league.playoffs} onPlay={playPO} onSim={simPO} onNewSeason={newSeason} />
       ) :
       tab === 'players' ? <PlayerBrowser /> :
       tab === 'rules' ? <HowToPlay /> :
       tab === 'team' && inPlay ? <TeamStatsPanel game={g} /> :
       state.phase === 'setup' ? (
        <div>
          {/* EXHIBITION */}
          <div style={{ ...CARD, borderLeft: '3px solid #E63946' }}>
            <div style={{ fontSize: 16, fontWeight: 800, color: '#E63946' }}>Exhibition</div>
            <div style={{ fontSize: 11, color: '#8A959E', margin: '4px 0 10px', lineHeight: 1.5 }}>
              A single game, no strings attached. Tap to play the Orioles against a random team, or open setup to choose both sides and who you control.
            </div>
            <button onClick={() => { mut(ns => { ns.setup = { away: 'Random', home: 'Orioles', control: 'home' }; }); startGame(); }}
              style={{ width: '100%', padding: '12px 0', borderRadius: 10, border: 'none', marginBottom: 8,
                background: '#E63946', color: '#fff', fontWeight: 800, fontSize: 15, cursor: 'pointer' }}>
              PLAY — Orioles vs Random
            </button>
            <button onClick={() => setShowExhib(s => !s)} style={{ ...BTN, width: '100%', padding: '8px 0', fontSize: 12, color: '#8A959E' }}>
              {showExhib ? 'Hide setup' : 'Custom matchup…'}
            </button>
            {showExhib && (
              <div style={{ marginTop: 10 }}>
                {['away', 'home'].map(sideKey => (
                  <div key={sideKey} style={{ marginBottom: 8 }}>
                    <div style={{ fontSize: 11, color: '#8A959E', marginBottom: 4 }}>{sideKey === 'away' ? 'Away team' : 'Home team'}</div>
                    <div style={{ display: 'flex', gap: 6 }}>
                      {['Orioles', 'Legends', 'Random'].map(k => (
                        <button key={k} onClick={() => mut(ns => { ns.setup[sideKey] = k; })} style={{ ...BTN, flex: 1, padding: '7px 0', fontSize: 12,
                          background: state.setup[sideKey] === k ? '#2A3138' : '#1A1F24', fontWeight: state.setup[sideKey] === k ? 700 : 400 }}>{k}</button>
                      ))}
                    </div>
                  </div>
                ))}
                <div style={{ fontSize: 11, color: '#8A959E', marginBottom: 4 }}>You control</div>
                <div style={{ display: 'flex', gap: 6, marginBottom: 10 }}>
                  {[['home', 'Home'], ['away', 'Away'], ['both', 'Both']].map(([k, lbl]) => (
                    <button key={k} onClick={() => mut(ns => { ns.setup.control = k; })} style={{ ...BTN, flex: 1, padding: '7px 0', fontSize: 12,
                      background: state.setup.control === k ? '#2A3138' : '#1A1F24', fontWeight: state.setup.control === k ? 700 : 400 }}>{lbl}</button>
                  ))}
                </div>
                <button onClick={startGame} style={{ width: '100%', padding: '11px 0', borderRadius: 10, border: 'none',
                  background: '#E63946', color: '#fff', fontWeight: 800, fontSize: 14, cursor: 'pointer' }}>START GAME</button>
              </div>
            )}
          </div>

          {/* FRANCHISE */}
          <div style={{ ...CARD, borderLeft: '3px solid #F2A93B' }}>
            <div style={{ fontSize: 16, fontWeight: 800, color: '#F2A93B' }}>Franchise</div>
            <div style={{ fontSize: 11, color: '#8A959E', margin: '4px 0 10px', lineHeight: 1.5 }}>
              Draft a team from a shared pool, then play a full season against seven AI clubs — schedule, standings, stat leaders, playoffs, and a running all-time record across seasons.
            </div>
            {saved.franchise && (
              <button onClick={() => continueMode('franchise')} style={{ width: '100%', padding: '12px 0', borderRadius: 10, border: 'none', marginBottom: 8,
                background: '#F2A93B', color: '#111417', fontWeight: 800, fontSize: 15, cursor: 'pointer' }}>CONTINUE SEASON</button>
            )}
            <button onClick={() => {
              if (!saved.franchise) { startDraft(); return; }
              if (confirmNew === 'franchise') { setConfirmNew(null); startDraft(); }
              else setConfirmNew('franchise');
            }}
              style={{ width: '100%', padding: saved.franchise ? '9px 0' : '12px 0', borderRadius: 10,
                border: confirmNew === 'franchise' ? '1px solid #E63946' : saved.franchise ? '1px solid #3a4650' : 'none',
                background: confirmNew === 'franchise' ? '#E63946' : saved.franchise ? 'transparent' : '#F2A93B',
                color: confirmNew === 'franchise' ? '#fff' : saved.franchise ? '#8A959E' : '#111417',
                fontWeight: 800, fontSize: saved.franchise ? 13 : 15, cursor: 'pointer' }}>
              {!saved.franchise ? 'START DRAFT' : confirmNew === 'franchise' ? 'Tap again to replace your season' : 'New franchise'}
            </button>
          </div>

          {/* LADDER */}
          <div style={{ ...CARD, borderLeft: '3px solid #5FA88F' }}>
            <div style={{ fontSize: 16, fontWeight: 800, color: '#5FA88F' }}>The Ladder <span style={{ fontSize: 11, color: '#8A959E', fontWeight: 400 }}>· roguelike</span></div>
            <div style={{ fontSize: 11, color: '#8A959E', margin: '4px 0 10px', lineHeight: 1.5 }}>
              Draft 3 of 5 hand-picked players to seed your club, then climb five levels from the sandlot up to a team of legends. Win games for tokens, spend them between games at the player shop, and after each series win draft 3 of 5 stars of that tier. Lose a series and the run is over.
            </div>
            {saved.ladder && (
              <button onClick={() => continueMode('ladder')} style={{ width: '100%', padding: '12px 0', borderRadius: 10, border: 'none', marginBottom: 8,
                background: '#5FA88F', color: '#111417', fontWeight: 800, fontSize: 15, cursor: 'pointer' }}>CONTINUE RUN</button>
            )}
            <button onClick={() => {
              if (!saved.ladder) { startLadder(); return; }
              if (confirmNew === 'ladder') { setConfirmNew(null); startLadder(); }
              else setConfirmNew('ladder');
            }}
              style={{ width: '100%', padding: saved.ladder ? '9px 0' : '12px 0', borderRadius: 10,
                border: confirmNew === 'ladder' ? '1px solid #E63946' : saved.ladder ? '1px solid #3a4650' : 'none',
                background: confirmNew === 'ladder' ? '#E63946' : saved.ladder ? 'transparent' : '#5FA88F',
                color: confirmNew === 'ladder' ? '#fff' : saved.ladder ? '#8A959E' : '#111417',
                fontWeight: 800, fontSize: saved.ladder ? 13 : 15, cursor: 'pointer' }}>
              {!saved.ladder ? 'START A RUN' : confirmNew === 'ladder' ? 'Tap again to end your run' : 'New run'}
            </button>
          </div>
        </div>
       ) : !inPlay ? null : tab === 'box' ? <BoxScore game={g} /> : (
        <GameView
          g={g} myDie={myDie} setMyDie={setMyDie}
          pitch={pitch} simHalf={simHalf}
          onDecision={(send) => mut(ns => { resolveDecision(ns.game, send); if (ns.game.advQueue.length === 0) maybeEndHalf(ns.game); })}
          onSteal={(b) => mut(ns => { attemptSteal(ns.game, b); })}
          onDoubleSteal={() => mut(ns => {
            const g = ns.game;
            const lead = g.bases[1], trail = g.bases[0];
            g.advQueue.unshift({ kind: 'dblStealThrow', defense: true,
              runner: lead, trail, target: lead.spd + 7,
              thrower: { name: fielderAt(fldTeam(g), 'C') ? fielderAt(fldTeam(g), 'C').name : 'the catcher',
                         arm: fielderAt(fldTeam(g), 'C') ? fielderAt(fldTeam(g), 'C').arm : 2 },
              label: 'Double steal in motion — throw to third or second?' });
            drainDecisionsAI(g);   // if the defense is the AI, it decides now
          })}
          onIBB={() => mut(ns => { issueIBB(ns.game); })}
          forcedSPDone={forcedSPDone}
          availableRelief={availableRelief}
          showPitch={showPitch} setShowPitch={setShowPitch}
          onChangePitcher={(pid) => { mut(ns => { changePitcher(ns.game, pid); }); setShowPitch(false); }}
          showPH={showPH} setShowPH={setShowPH}
          onPinchHit={(pid) => { mut(ns => { pinchHit(ns.game, pid); }); setShowPH(false); flash('Remember to fix positions before fielding.'); }}
          showDefSub={showDefSub} setShowDefSub={setShowDefSub}
          onDefSub={(sideKey, benchPid, outPid) => { mut(ns => { defSub(ns.game, sideKey, benchPid, outPid); }); setShowDefSub(false); }}
          showPos={showPos} setShowPos={setShowPos}
          onApplyPos={(sideKey, positions, dh) => { mut(ns => { ns.game.teams[sideKey].positions = positions; ns.game.teams[sideKey].dh = dh; }); setShowPos(null); }}
          onNewGame={() => { if (state.phase === 'ladderplay') { ladderFinishGame(); } else if (state.phase === 'leagueplay') { if (state.pendingPO) finishPOGame(); else finishLeagueGame(); } else mut(ns => { ns.phase = 'setup'; ns.game = null; }); }}
          onSimGame={simGame}
          onFinishGame={() => { if (state.phase === 'ladderplay') { ladderFinishGame(); } else if (state.phase === 'leagueplay') { if (state.pendingPO) finishPOGame(); else finishLeagueGame(); } else mut(ns => { ns.phase = 'setup'; ns.game = null; }); }}
          logRef={logRef}
        />
       )}

      <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 10, marginTop: 4 }}>
        <button onClick={() => { setShowExport(s => !s); setImportText(''); }} style={{ ...BTN, marginLeft: 'auto', padding: '5px 10px', fontSize: 11, color: '#8A959E' }}>Backup / Restore</button>
      </div>
      {showExport && (
        <div style={CARD}>
          <textarea value={importText || JSON.stringify(state)} onChange={e => setImportText(e.target.value)} onFocus={e => e.target.select()}
            style={{ width: '100%', height: 80, background: '#111417', color: '#9FB0BA', border: '1px solid #2A3138', borderRadius: 6, fontSize: 10, padding: 6, fontFamily: 'monospace' }} />
          <button onClick={() => {
            try { const s = rehydrateGenerics(JSON.parse(importText)); if (!s.phase) throw new Error('invalid'); if (!saveIsCompatible(s)) throw new Error('save is from an older version'); setState(s); setShowExport(false); flash('Restored ✓'); }
            catch (e) { flash('Restore failed: ' + e.message, 2500); }
          }} style={{ ...BTN, width: '100%', padding: '8px 0', marginTop: 6, color: '#F2A93B' }}>Restore from pasted code</button>
        </div>
      )}
      {toast && (
        <div style={{ position: 'fixed', bottom: 18, left: '50%', transform: 'translateX(-50%)', background: '#F2A93B',
          color: '#111417', padding: '8px 16px', borderRadius: 16, fontSize: 13, fontWeight: 700, maxWidth: '90%', textAlign: 'center' }}>{toast}</div>
      )}
    </div>
  );
}

// ---------- DEF SUB SELECTOR (swap, no typing) ----------
function DefSubSelector({ team, sideKey, onSwap, onCancel }) {
  const benchAvail = team.bench.filter(pid => !team.removed.includes(pid));
  const onField = team.order;
  const [inPid, setInPid] = useState(benchAvail[0] || '');
  const [outPid, setOutPid] = useState(onField[0] || '');
  const inP = byId[inPid]; const outP = byId[outPid];
  // what spot does outPid currently play?
  let outSpot = 'DH';
  ALL_SPOTS.forEach(s => { if (team.positions[s] === outPid) outSpot = s; });
  const elig = inP && outSpot !== 'DH' ? eligibility(inP, outSpot) : 'ok';
  return (
    <div style={{ marginTop: 8, padding: 10, background: '#111417', border: '1px solid #2A3138', borderRadius: 8 }}>
      <div style={{ ...LABEL, marginBottom: 6 }}>Defensive swap</div>
      <div style={{ display: 'flex', gap: 6, alignItems: 'center', marginBottom: 6 }}>
        <span style={{ fontSize: 11, color: '#8A959E', width: 30 }}>In</span>
        <select value={inPid} onChange={e => setInPid(e.target.value)} style={{ flex: 1, background: '#1A1F24', color: '#EDEDE3', border: '1px solid #2A3138', borderRadius: 6, fontSize: 12, padding: '5px' }}>
          {benchAvail.map(pid => <option key={pid} value={pid}>{byId[pid].name} ({byId[pid].pos})</option>)}
        </select>
      </div>
      <div style={{ display: 'flex', gap: 6, alignItems: 'center', marginBottom: 8 }}>
        <span style={{ fontSize: 11, color: '#8A959E', width: 30 }}>Out</span>
        <select value={outPid} onChange={e => setOutPid(e.target.value)} style={{ flex: 1, background: '#1A1F24', color: '#EDEDE3', border: '1px solid #2A3138', borderRadius: 6, fontSize: 12, padding: '5px' }}>
          {onField.map(pid => { let sp = 'DH'; ALL_SPOTS.forEach(s => { if (team.positions[s] === pid) sp = s; }); return <option key={pid} value={pid}>{byId[pid].name} ({sp})</option>; })}
        </select>
      </div>
      {inP && outSpot !== 'DH' && elig === null && (
        <div style={{ fontSize: 11, color: '#E63946', marginBottom: 6 }}>{inP.name} can't play {outSpot} — fix via Positions after.</div>
      )}
      {inP && outSpot !== 'DH' && elig === 'pen' && (
        <div style={{ fontSize: 11, color: '#F2A93B', marginBottom: 6 }}>{inP.name} at {outSpot} takes a −1 DEF penalty.</div>
      )}
      <div style={{ display: 'flex', gap: 8 }}>
        <button onClick={() => onSwap(sideKey, inPid, outPid)} style={{ ...BTN, flex: 1, padding: '8px 0', background: '#F2A93B', color: '#111417', fontWeight: 700, border: 'none' }}>Swap</button>
        <button onClick={onCancel} style={{ ...BTN, flex: 1, padding: '8px 0' }}>Cancel</button>
      </div>
    </div>
  );
}

// ---------- GAME VIEW ----------
function GameView(props) {
  const { g, myDie, setMyDie, pitch, simHalf, onDecision, onSteal, onDoubleSteal, onIBB,
    forcedSPDone, availableRelief, showPitch, setShowPitch, onChangePitcher,
    showPH, setShowPH, onPinchHit, showDefSub, setShowDefSub, onDefSub, showPos, setShowPos, onApplyPos, onNewGame, onSimGame, onFinishGame, logRef } = props;

  const side = battingSide(g);
  const bt = batTeam(g);
  const ft = fldTeam(g);
  const batter = currentBatter(g);
  const pitcher = byId[ft.curP];
  const pst = ft.pitState[pitcher.id];
  const bHeat = bt.batHeat[batter.id] || 0;
  const bEffAll = batEff(batter, bHeat);
  const pEffAll = pitEff(pitcher, pst.fatigue);
  const uc = g.userControls;
  const userBats = uc === side || uc === 'both';
  const userFields = uc === fieldingSide(g) || uc === 'both';
  const userRole = uc === 'both' ? 'batter' : (userBats ? 'batter' : userFields ? 'pitcher' : 'watch');
  const userDice = userRole === 'batter' ? BATTER_DICE : PITCHER_DICE;
  const statSource = userRole === 'batter'
    ? { red: bEffAll.pow, blue: bEffAll.con, black: bEffAll.onb }
    : { red: pEffAll.pow, blue: pEffAll.ctl, black: pEffAll.chg };
  const pendingDec = g.advQueue.length > 0 ? g.advQueue[0] : null;
  const stealTargets = userBats && !g.over && !pendingDec
    ? [0, 1].filter(b => g.bases[b] && !g.bases[b + 1]) : [];
  const canDoubleSteal = userBats && !g.over && !pendingDec && g.bases[0] && g.bases[1] && !g.bases[2];
  const benchAvail = bt.bench.filter(pid => !bt.removed.includes(pid));
  const lp = g.lastPlay;

  return (
    <>
      {/* Line score */}
      <div style={{ ...CARD, padding: '10px 12px', overflowX: 'auto' }}>
        <table style={{ ...MONO, fontSize: 12, borderCollapse: 'collapse', width: '100%' }}>
          <thead><tr style={{ color: '#8A959E' }}>
            <th style={{ textAlign: 'left', paddingRight: 8 }}></th>
            {Array.from({ length: Math.max(INNINGS, g.inning) }).map((_, i) => <th key={i} style={{ padding: '0 3px' }}>{i + 1}</th>)}
            <th style={{ paddingLeft: 8 }}>R</th><th style={{ paddingLeft: 6 }}>H</th><th style={{ paddingLeft: 6 }}>E</th>
          </tr></thead>
          <tbody>
            {['away', 'home'].map(s => {
              const t = g.teams[s];
              const cells = Array.from({ length: Math.max(INNINGS, g.inning) });
              return (
                <tr key={s} style={{ fontWeight: (side === s && !g.over) ? 700 : 400 }}>
                  <td style={{ color: t.color, paddingRight: 8 }}>{t.name}{(uc === s || uc === 'both') ? ' •' : ''}</td>
                  {cells.map((_, i) => <td key={i} style={{ textAlign: 'center', padding: '0 3px' }}>{g.lineScore[s][i] === null || g.lineScore[s][i] === undefined ? '-' : g.lineScore[s][i]}</td>)}
                  <td style={{ textAlign: 'center', paddingLeft: 8, fontWeight: 700 }}>{g.score[s]}</td>
                  <td style={{ textAlign: 'center', paddingLeft: 6 }}>{g.hits[s]}</td>
                  <td style={{ textAlign: 'center', paddingLeft: 6 }}>{g.errors[s]}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {/* Situation */}
      <div style={{ ...CARD, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div>
          <div style={LABEL}>{g.over ? 'Final' : `${g.half === 'top' ? 'Top' : 'Bot'} ${g.inning}`}</div>
          <div style={{ fontSize: 13 }}>{g.over ? 'Game over' : `${g.outs} out${g.outs !== 1 ? 's' : ''}`}</div>
        </div>
        <div style={{ position: 'relative', width: 54, height: 54 }}>
          {[{ b: 1, x: 40, y: 27 }, { b: 2, x: 22, y: 8 }, { b: 3, x: 4, y: 27 }].map(({ b, x, y }) => (
            <div key={b} style={{ position: 'absolute', left: x, top: y, width: 13, height: 13, transform: 'rotate(45deg)',
              borderRadius: 2, background: g.bases[b - 1] ? '#F2A93B' : '#2A3138', border: '1px solid #3a434c' }} />
          ))}
          <div style={{ position: 'absolute', left: 22, top: 42, width: 12, height: 12, transform: 'rotate(45deg)',
            background: '#2A3138', border: '1px solid #3a434c', borderRadius: 2 }} />
        </div>
        <div style={{ textAlign: 'right', fontSize: 11, color: '#8A959E', maxWidth: 130 }}>
          {g.bases.map((r, i) => r ? <div key={i}>{['1B', '2B', '3B'][i]}: {r.name}</div> : null)}
        </div>
      </div>

      {/* Matchup */}
      {!g.over && (
        <div style={{ display: 'flex', gap: 10 }}>
          <div style={{ ...CARD, flex: 1 }}>
            <div style={LABEL}>Pitching — {ft.name}</div>
            <div style={{ fontWeight: 700, margin: '4px 0', fontSize: 13 }}>
              {pitcher.name} <span style={{ color: '#8A959E', fontSize: 10 }}>{pitcher.throws}HP · {pitcher.type}</span>
            </div>
            <div style={{ fontSize: 10, color: '#8A959E' }}>Fatigue: {pst.fatigue}{pitcher.type === 'SP' ? '/4' : ''}</div>
            <div style={{ ...MONO, fontSize: 11.5, marginTop: 4 }}>
              <span style={{ color: '#E63946' }}>POW {pEffAll.pow}</span>{' '}
              <span style={{ color: '#457B9D' }}>SPN {pEffAll.ctl}</span>{' '}
              <span style={{ color: '#8D99AE' }}>CHG {pEffAll.chg}</span>
            </div>
          </div>
          <div style={{ ...CARD, flex: 1 }}>
            <div style={LABEL}>Batting — {bt.name} (#{g.batterIdx[side] + 1})</div>
            <div style={{ fontWeight: 700, margin: '4px 0', fontSize: 13 }}>
              {batter.name} <span style={{ color: '#8A959E', fontSize: 10 }}>{batter.bats}H · SPD{batter.spd}</span>
            </div>
            <HeatBar heat={bHeat} max={4} />
            <div style={{ ...MONO, fontSize: 11.5, marginTop: 4 }}>
              <span style={{ color: '#E63946' }}>POW {bEffAll.pow}</span>{' '}
              <span style={{ color: '#457B9D' }}>CON {bEffAll.con}</span>{' '}
              <span style={{ color: '#8D99AE' }}>ONB {bEffAll.onb}</span>
              {batter.bats !== 'S' && batter.bats === pitcher.throws && <span style={{ color: '#E63946' }}> · platoon</span>}
            </div>
          </div>
        </div>
      )}

      {/* Forced pitching change banner */}
      {forcedSPDone && userFields && !g.over && (
        <div style={{ ...CARD, border: '1px solid #E6394666', background: '#E6394611' }}>
          <div style={{ fontWeight: 700, color: '#E63946', marginBottom: 6 }}>{pitcher.name} is out of gas — make a pitching change.</div>
          <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
            {availableRelief.map(pid => {
              const p = byId[pid];
              const c = (ft.pitState[pid] && ft.pitState[pid].fatigue) || 0;
              const e = pitEff(p, c);
              const worn = c > 0;
              return <button key={pid} onClick={() => onChangePitcher(pid)} style={{ ...BTN, padding: '8px 10px', fontSize: 12, fontWeight: 700 }}>
                {p.name} <span style={{ ...MONO, fontSize: 10, fontWeight: 400, color: worn ? '#F2A93B' : '#8A959E' }}>({e.pow}/{e.ctl}/{e.chg}{worn ? ' · ' + c + ' clk' : ' · fresh'})</span>
              </button>;
            })}
          </div>
        </div>
      )}

      {/* Pending decision */}
      {pendingDec && !g.over && (() => {
        const isDef = !!pendingDec.defense;
        const isDblSteal = pendingDec.kind === 'dblStealThrow';
        const isLeadOrFree = pendingDec.kind === 'leadOrFree';
        const isGb13 = pendingDec.kind === 'gb13Throw';
        const isHitPick = pendingDec.kind === 'hitThrowPick';
        const isTagPick = pendingDec.kind === 'tagThrowPick';
        const hitPickTwo = isHitPick && pendingDec.sent && pendingDec.sent.length > 1;
        // a defensive decision is made by whoever is FIELDING; a normal one by the batting side
        const userDecides = isDef ? userFields : userBats;
        const yesLabel = isDblSteal ? 'THROW 3RD' : isLeadOrFree ? 'GO FOR LEAD' : isGb13 ? 'THROW HOME' : isHitPick ? (hitPickTwo ? 'THROW LEAD' : 'THROW') : isTagPick ? 'THROW LEAD' : isDef ? 'THROW' : 'SEND';
        const noLabel = isDblSteal ? 'THROW 2ND' : isLeadOrFree ? 'SURE OUT' : isGb13 ? 'TAKE OUTS' : isHitPick ? (hitPickTwo ? 'THROW TRAIL' : 'CONCEDE') : isTagPick ? 'THROW TRAIL' : isDef ? 'CONCEDE' : 'HOLD';
        return (
        <div style={{ ...CARD, border: '1px solid #F2A93B66', background: '#F2A93B0d' }}>
          <div style={{ fontWeight: 700, marginBottom: 4, color: '#F2A93B' }}>{pendingDec.label}</div>
          {pendingDec.target != null ? (
            <div style={{ ...MONO, fontSize: 12.5, color: '#C9D4DB', marginBottom: 8 }}>
              SPD {pendingDec.runner.spd} vs {pendingDec.thrower.name} (ARM {pendingDec.thrower.arm}) —
              out if 2d6 + arm{pendingDec.thrower.arm} ≥ {pendingDec.target + 1}{pendingDec.breakdown ? ` (${pendingDec.breakdown})` : ''}
            </div>
          ) : (isHitPick || isTagPick) ? (
            <div style={{ ...MONO, fontSize: 12.5, color: '#C9D4DB', marginBottom: 8 }}>
              {pendingDec.sent.map(s => s.runner.name).join(' and ')} going — the un-thrown runner{pendingDec.sent.length > 2 ? 's' : ''} advance{pendingDec.sent.length > 2 ? '' : 's'} on the relay.
            </div>
          ) : (
            <div style={{ ...MONO, fontSize: 12.5, color: '#C9D4DB', marginBottom: 8 }}>
              {pendingDec.runner.name} (SPD {pendingDec.runner.spd}) — if sent, the defense picks whom to throw out.
            </div>
          )}
          {userDecides ? (
            <div style={{ display: 'flex', gap: 8 }}>
              <button onClick={() => onDecision(true)} style={{ flex: 1, padding: '10px 0', borderRadius: 8, border: 'none', cursor: 'pointer', background: '#F2A93B', color: '#111417', fontWeight: 800 }}>{yesLabel}</button>
              <button onClick={() => onDecision(false)} style={{ ...BTN, flex: 1, padding: '10px 0', fontWeight: 700 }}>{noLabel}</button>
            </div>
          ) : (
            <button onClick={() => onDecision(aiWouldSend(pendingDec, g.outs))} style={{ ...BTN, width: '100%', padding: '10px 0', fontWeight: 700 }}>Opponent decides…</button>
          )}
        </div>
        );
      })()}

      {/* Die picker + actions */}
      {!g.over && !pendingDec && userRole !== 'watch' && (
        <div style={CARD}>
          <DiePicker dice={userDice} selected={myDie} onPick={setMyDie} statSource={statSource}
            label={userRole === 'batter' ? 'Your batter die — match the pitcher for +3' : 'Your pitcher die'} />
          <div style={{ display: 'flex', gap: 6, marginTop: 8, flexWrap: 'wrap' }}>
            {stealTargets.map(b => (
              <button key={b} onClick={() => onSteal(b)} style={{ ...BTN, flex: 1, minWidth: 110, padding: '7px 0', fontSize: 11, fontWeight: 700, color: '#F2A93B', border: '1px solid #F2A93B44', background: '#F2A93B15' }}>
                Steal {b === 0 ? '2nd' : '3rd'} ({g.bases[b].name})
              </button>
            ))}
            {canDoubleSteal && (
              <button onClick={() => onDoubleSteal()} style={{ ...BTN, flex: 1, minWidth: 110, padding: '7px 0', fontSize: 11, fontWeight: 700, color: '#F2A93B', border: '1px solid #F2A93B44', background: '#F2A93B15' }}>
                Double steal
              </button>
            )}
            {userBats && benchAvail.length > 0 && (
              <button onClick={() => setShowPH(s => !s)} style={{ ...BTN, flex: 1, minWidth: 100, padding: '7px 0', fontSize: 11 }}>Pinch hit</button>
            )}
            {userFields && (
              <button onClick={() => onIBB()} style={{ ...BTN, flex: 1, minWidth: 100, padding: '7px 0', fontSize: 11, color: '#8FBCD4' }}>IBB {batter.name}</button>
            )}
            {userFields && availableRelief.length > 0 && !forcedSPDone && (
              <button onClick={() => setShowPitch(s => !s)} style={{ ...BTN, flex: 1, minWidth: 110, padding: '7px 0', fontSize: 11 }}>Pitching change</button>
            )}
            {userFields && bt.bench && false}
            {userFields && ft.bench.filter(pid => !ft.removed.includes(pid)).length > 0 && (
              <button onClick={() => setShowDefSub(s => !s)} style={{ ...BTN, flex: 1, minWidth: 110, padding: '7px 0', fontSize: 11 }}>Defensive sub</button>
            )}
            <button onClick={() => setShowPos(uc === 'both' ? fieldingSide(g) : (userFields ? fieldingSide(g) : side))} style={{ ...BTN, flex: 1, minWidth: 90, padding: '7px 0', fontSize: 11 }}>Positions</button>
          </div>
          {showPH && (
            <div style={{ marginTop: 8 }}>
              <div style={{ ...LABEL, marginBottom: 4 }}>Pinch hit for {batter.name}:</div>
              <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                {benchAvail.map(pid => {
                  const p = byId[pid];
                  const h = (bt.batHeat[pid]) || 0;
                  const e = batEff(p, h);
                  return <button key={pid} onClick={() => onPinchHit(pid)} style={{ ...BTN, padding: '7px 10px', fontSize: 11 }}>
                    {p.name} <span style={{ ...MONO, fontSize: 9, color: h > 0 ? '#5FA88F' : h < 0 ? '#E63946' : '#8A959E' }}>{handTag(p)} ({e.pow}/{e.con}/{e.onb}{h ? ' · ' + (h > 0 ? '+' + h : h) : ''})</span>
                  </button>;
                })}
              </div>
            </div>
          )}
          {showPitch && (
            <div style={{ marginTop: 8 }}>
              <div style={{ ...LABEL, marginBottom: 4 }}>Bring in:</div>
              <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                {availableRelief.map(pid => {
                  const p = byId[pid];
                  const c = (ft.pitState[pid] && ft.pitState[pid].fatigue) || 0;
                  const e = pitEff(p, c);
                  const worn = c > 0;
                  return <button key={pid} onClick={() => onChangePitcher(pid)} style={{ ...BTN, padding: '7px 10px', fontSize: 11 }}>
                    {p.name} <span style={{ ...MONO, fontSize: 9, color: worn ? '#F2A93B' : '#8A959E' }}>({e.pow}/{e.ctl}/{e.chg}{worn ? ' · ' + c + ' clk' : ''})</span>
                  </button>;
                })}
              </div>
            </div>
          )}
          {showDefSub && (
            <DefSubSelector team={ft} sideKey={fieldingSide(g)} onSwap={onDefSub} onCancel={() => setShowDefSub(false)} />
          )}
        </div>
      )}

      {/* Positions editor */}
      {showPos && (
        <PositionsEditor team={g.teams[showPos]} onClose={() => setShowPos(null)}
          onApply={(positions, dh) => onApplyPos(showPos, positions, dh)} />
      )}

      {/* Last play */}
      {lp && lp.events && lp.events.length > 0 && (
        <div style={{ ...CARD, borderLeft: `3px solid ${lp.outcome === 'HR' ? '#E63946' : lp.outcome === 'K' ? '#457B9D' : '#F2A93B'}` }}>
          {lp.events.map((ev, i) => (
            <div key={i} style={{ marginBottom: i < lp.events.length - 1 ? 7 : 0 }}>
              <div style={{ fontWeight: i === 0 ? 700 : 500, fontSize: 13 }}>{ev.t}</div>
              {ev.d && ev.d.split(' · ').map((line, j) => (
                <div key={j} style={{ ...MONO, fontSize: 12.5, color: '#9FB0BA' }}>{line}</div>
              ))}
            </div>
          ))}
        </div>
      )}

      {/* Controls */}
      <div style={{ display: 'flex', gap: 8, marginBottom: 10 }}>
        <button onClick={pitch} disabled={g.over || !!pendingDec || (forcedSPDone && userFields)} style={{
          flex: 2, padding: '14px 0', borderRadius: 10, border: 'none',
          background: (g.over || pendingDec || (forcedSPDone && userFields)) ? '#2A3138' : '#E63946', color: '#fff',
          fontWeight: 800, fontSize: 16, cursor: 'pointer', letterSpacing: '0.05em' }}>
          {pendingDec ? 'RUNNER DECISION…' : forcedSPDone && userFields ? 'CHANGE PITCHER' : myDie ? 'PITCH' : 'PITCH (auto die)'}
        </button>
        <button onClick={simHalf} disabled={g.over} style={{ ...BTN, flex: 1, padding: '14px 0', fontSize: 13 }}>Sim ½</button>
      </div>
      <div style={{ display: 'flex', gap: 8, marginBottom: 10 }}>
        {!g.over
          ? <button onClick={onSimGame} style={{ ...BTN, flex: 1, padding: '9px 0', fontSize: 12 }}>Sim to end of game</button>
          : <button onClick={onFinishGame} style={{ ...BTN, flex: 1, padding: '9px 0', fontSize: 12, background: '#F2A93B', color: '#111417', border: 'none', fontWeight: 700 }}>Done — back to season</button>}
      </div>

      <div ref={logRef} style={{ ...CARD, height: 130, overflowY: 'auto', fontSize: 12, color: '#9FB0BA', lineHeight: 1.7 }}>
        {g.log.map((l, i) => <div key={i}>{l}</div>)}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<TTBaseball />);
</script>
</body>
</html>
