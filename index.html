      <div style={c}><div style={h}>The At-Bat</div>
        Both sides secretly pick a die. Die color selects the stat used (batter POW/CON/ONB, pitcher POW/SPN/CHG).
        Die value + stat = total. The <b>batter must beat the pitcher's total — ties go to the pitcher.</b> The winner's die face is the result.
        Match the pitcher's color for <b>+3</b> to the batter (a bad hitter's puncher's chance). Pitcher gets <b>+1</b> on a handedness match (switch hitters immune).
      </div>
      <div style={c}><div style={h}>The Dice</div>
        <div style={MONO}>
          <span style={{ color: '#E63946' }}>■ Power:</span> {dieLine(BATTER_DICE.red)}<br/>
          <span style={{ color: '#457B9D' }}>■ Contact:</span> {dieLine(BATTER_DICE.blue)}<br/>
          <span style={{ color: '#8D99AE' }}>■ On Base:</span> {dieLine(BATTER_DICE.black)}<br/><br/>
          <span style={{ color: '#E63946' }}>■ P-Power:</span> {dieLine(PITCHER_DICE.red)}<br/>
          <span style={{ color: '#457B9D' }}>■ Spin:</span> {dieLine(PITCHER_DICE.blue)}<br/>
          <span style={{ color: '#8D99AE' }}>■ Change:</span> {dieLine(PITCHER_DICE.black)}
        </div>
        <div style={{ fontSize: 11, color: '#8A959E', marginTop: 6 }}>Max hitting stat is 7. Triples sit on a low contact face (rare); singles are common.</div>
      </div>
      <div style={c}><div style={h}>Fielding</div>
        Spray chart sends GB/FB to a fielder: <span style={MONO}>2d6 + DEF ≥ 6</span> is an out. Natural position = no penalty; a listed <b>backup</b> position = <b>−1 DEF</b>; fully out of position = <b>−2 DEF</b> (a DH can field, at −2). UT covers any infield spot and CF any outfield spot for free; only catchers may catch; a pitcher fields comebackers at DEF 1.
        Double 1s = error (batter reaches, fielder tires). Double 6s = web gem (fielder sharpens). Failed check = single.
        <div style={{ fontSize: 11, color: '#8A959E', marginTop: 6 }}>Out% by DEF: 0→72%, 1→83%, 2→92%, 3→97%.</div>
      </div>
      <div style={c}><div style={h}>Baserunning &amp; Steals</div>
        <div style={{ marginBottom: 8 }}>
          <b>The send/hold check.</b> Whenever a runner tries for an extra base, he's out if <span style={MONO}>2d6 + fielder ARM ≥ SPD + 8</span> (safe below that). Every prompt spells out where the number comes from — e.g. <span style={MONO}>out ≥ 11 = 8 + spd2 + 1 home</span>.
        </div>
        <div style={{ marginBottom: 8 }}>
          <b>Speed modifiers.</b>
          <div style={{ paddingLeft: 12 }}>
            • Scoring from third on a <b>hit to the outfield</b>: <b>+1</b> (the throw comes from deep).<br/>
            • Tagging up <b>first → second</b> on a fly: <b>−1</b> (short throw, no time).<br/>
            • Throws to third, and plays at the plate off an <b>infield</b> grounder: <b>no</b> bonus.<br/>
            • The defense makes <b>one throw</b> on a play — any other runner going advances unchallenged.
          </div>
        </div>
        <div style={{ marginBottom: 8 }}>
          <b>Fly balls (tag-ups).</b> Any runner may tag. You <b>declare every send or hold before any throw is rolled</b> — commit first, find out after. A runner can only advance if the runner ahead of him vacates the base. Runners resolve deepest-first.
        </div>
        <div style={{ marginBottom: 8 }}>
          <b>Ground balls.</b> The fielding check comes first (a miss is a single). If it's caught, decisions follow by situation:
          <div style={{ paddingLeft: 12 }}>
            • With <b>2 outs</b>, the out at first ends the inning — no decisions, no runs.<br/>
            • <b>Man on third</b> (not forced): try the <b>contact play</b> home (straight speed check, no plate bonus).<br/>
            • <b>Man on second</b> may take third only if the ball was hit <b>behind him</b> (1B, 2B, or pitcher).<br/>
            • <b>First &amp; second</b>: a ball to short or third auto-forces the lead runner at third; a ball up the middle/right lets the defense choose — <b>go for the lead</b> at third or take the <b>sure out</b> at second.<br/>
            • <b>First &amp; third</b>: send the man home and the defense picks <b>throw home</b> or <b>take the out(s)</b> and concede the run.<br/>
            • <b>Bases loaded</b>: defense chooses <b>throw home</b> (force at the plate, no run) or <b>turn two</b> (a run scores, but you get the double play).<br/>
            • A grounder hit right at short or third is an automatic hold.
          </div>
        </div>
        <div style={{ marginBottom: 8 }}>
          <b>Double plays.</b> Only turned at first, only on a hard grounder (<b>fielding total 9+</b>), and only if the batter isn't already out. The batter beats the relay if <span style={MONO}>2d6 ≤ SPD + 5</span>. Web gems turn two automatically.
        </div>
        <div>
          <b>Steals.</b> Before the pitch, the catcher throws <span style={MONO}>2d6 + ARM</span> (+2 to third); the runner is out if that total <b>≥ SPD + 8</b>. No stealing home. On a <b>double steal</b> (first &amp; second) the defense throws to one base and the other runner is safe. In extra innings a runner starts on second.
        </div>
      </div>
      <div style={c}><div style={h}>Heat &amp; Fatigue — in-game</div>
        <b>Batters</b> (heat −4…+4): heat <b>up</b> on an RBI (a walk-off hit is worth <b>+2</b>) or on reaching base a 2nd time in a game (hits or walks); <b>down</b> for making the last out of an inning with a runner in scoring position, striking out with a runner in scoring position, or going 0-for-3+ in a game. Heat <b>carries between games</b> — a streak holds until you snap it (only a benched bat cools off).
        <b> Pitchers:</b> starters pitch through 4 fatigue steps — a 5th forces a sub. Each step saps effectiveness; relievers tire each inning (spin, then power, then change) until spent. Errors tire a fielder, web gems sharpen him.
      </div>
      <div style={c}><div style={h}>Fatigue across the season</div>
        The season runs in <b>days</b> (2 games each, every team plays once). Fatigue carries between games and recovers between days:
        a pitcher who pitched recovers <b>1 step</b>, one who rested <b>2</b>. Starters also tire from getting hit — they lose a step for every <b>third run</b> they allow across an outing (their 1st, 4th, and 7th run), so a rough day wears them out faster than a clean one. Batter heat <b>persists</b> — a hot or cold streak follows a player until he breaks it. Only a batter who <b>sits</b> cools off (2 toward neutral).
      </div>
      <div style={c}><div style={h}>Rosters &amp; Seasons</div>
        17-man rosters (11 hitters + 3 SP + 3 RP), star cap 40. Draft 5 from the pool, auto-fill with 0★ free agents, then claim randoms.
        Win it all and start a new season: rosters carry, fatigue resets, and new randoms are awarded by reverse finish (1st→4, 2nd→5, 3rd→6, last→8).
      </div>
      <div style={c}><div style={h}>Two-way players</div>
        Ruth and Ohtani can <b>start on the mound and bat in the same game</b>. The arm is tracked separately from the bat — its own stat line, its own fatigue, its own box score — but it uses one of your three starting-pitcher slots. Pick him in the pregame pitcher list (marked 2-WAY).
      </div>
      <div style={c}><div style={h}>Positions &amp; penalties</div>
        Every player has a natural position. Some also list a <b>backup</b> position (shown as <span style={MONO}>SS/3B</span>): playing there costs <b>−1 DEF</b> (◐). Anywhere else is <b>−2 DEF</b> (⚠) — and a DH can take the field on those terms. UT covers the whole infield and CF the whole outfield for free. Only a catcher may catch.
      </div>
      <div style={c}><div style={h}>Substitutions</div>
        Pinch hitters, defensive subs, and pitching changes any time — a substituted player cannot return.
        After a pinch hitter, use the fielding editor to fix your defense (out-of-position penalties apply).
      </div>
    </div>
  );
}

// ---------- DRAFT ROOM UI (Piece 1) ----------
function DraftRoom({ ds, onPick, onSim, onAuto, onFinish }) {
  const [filter, setFilter] = useState('ALL');
  const onClock = draftOnClock(ds);
  const r = ds.rosters[onClock];
  const isUser = r.isUser;
  const pickNo = ds.round * 4 + ds.pickInRound + 1;
  const userR = ds.rosters[ds.userIdx];
  const buckets = ['C','1B','2B','SS','3B','UT','CO','CF','DH','SP','RP'];
  const poolByBucket = {};
  ds.pool.forEach(id => { if (!byId[id]) return; const b = dPosBucket(byId[id]); (poolByBucket[b] = poolByBucket[b] || []).push(id); });
  const shown = ds.pool.filter(id => byId[id] && (filter === 'ALL' || dPosBucket(byId[id]) === filter))
    .sort((a, b) => byId[b].stars - byId[a].stars || (byId[b].pow + byId[b].con + byId[b].onb) - (byId[a].pow + byId[a].con + byId[a].onb));

  if (ds.done) {
    return (
      <div>
        <div style={{ ...CARD, textAlign: 'center' }}>
          <div style={{ fontSize: 16, fontWeight: 800, color: '#F2A93B' }}>Draft complete!</div>
        </div>
        {ds.rosters.map(rr => (
          <div key={rr.idx} style={CARD}>
            <div style={{ fontWeight: 800, color: rr.color, marginBottom: 4 }}>{rr.name} — {draftStars(rr.picks)}★</div>
            <div style={{ fontSize: 11, color: '#C9D4DB', lineHeight: 1.6 }}>
              {rr.picks.filter(id => byId[id]).slice().sort(dPosSort).map(id => <span key={id} style={{ marginRight: 8, display: 'inline-block' }}>{byId[id].name}<span style={{ color: '#8A959E' }}> {dPosBucket(byId[id])}{byId[id].pos2 ? <span style={{ color: '#5FA88F' }}>/{byId[id].pos2}</span> : null}·{byId[id].stars}★</span></span>)}
            </div>
          </div>
        ))}
        <button onClick={onFinish} style={{ ...BTN, width: '100%', padding: 12, fontWeight: 700, background: '#F2A93B', color: '#111417', border: 'none' }}>Done</button>
      </div>
    );
  }

  return (
    <div>
      <div style={{ ...CARD, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div>
          <div style={{ ...LABEL }}>Pick {pickNo} of {ds.totalRounds * ds.rosters.length} · Round {ds.round + 1} of {ds.totalRounds}</div>
          <div style={{ fontSize: 16, fontWeight: 800, color: r.color }}>{r.name}{isUser ? ' — YOU' : ' on the clock'}</div>
        </div>
        {!isUser && <button onClick={onSim} style={{ ...BTN, padding: '8px 12px' }}>Sim to my pick</button>}
      </div>

      <div style={CARD}>
        <div style={{ ...LABEL, marginBottom: 4 }}>Your roster ({userR.picks.length}/17) · {draftStars(userR.picks)}★</div>
        <div style={{ fontSize: 11, color: '#C9D4DB', lineHeight: 1.6 }}>
          {userR.picks.length === 0 ? <span style={{ color: '#5b6870' }}>No picks yet</span> :
            userR.picks.filter(id => byId[id]).slice().sort(dPosSort).map(id => <span key={id} style={{ marginRight: 8, display: 'inline-block' }}>{byId[id].name}<span style={{ color: '#8A959E' }}> {dPosBucket(byId[id])}{byId[id].pos2 ? <span style={{ color: '#5FA88F' }}>/{byId[id].pos2}</span> : null}·{byId[id].stars}★</span></span>)}
        </div>
      </div>

      {isUser ? (
        <div style={CARD}>
          <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap', marginBottom: 8 }}>
            {['ALL', ...buckets].map(b => (
              <button key={b} onClick={() => setFilter(b)} style={{ ...BTN, padding: '4px 8px', fontSize: 11, background: filter === b ? '#2A3138' : '#1A1F24' }}>
                {b}{b !== 'ALL' && poolByBucket[b] ? ' ' + poolByBucket[b].length : ''}
              </button>
            ))}
            <button onClick={onAuto} style={{ ...BTN, padding: '4px 8px', fontSize: 11, marginLeft: 'auto', color: '#8A959E' }}>Auto-pick</button>
          </div>
          <div style={{ maxHeight: '46vh', overflowY: 'auto' }}>
            {shown.map(id => {
              const p = byId[id];
              const line = p.type === 'B' ? p.pow + '/' + p.con + '/' + p.onb + '  ' + p.spd + '/' + p.def + '/' + p.arm : p.pow + '/' + p.ctl + '/' + p.chg + ' ' + p.throws;
              return (
                <div key={id} onClick={() => onPick(id)} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px 6px', borderBottom: '1px solid #22282e', cursor: 'pointer' }}>
                  <div>
                    <span style={{ color: '#EDEDE3', fontWeight: 600 }}>{p.name}</span>
                    <span style={{ color: '#8A959E', fontSize: 11 }}> {dPosBucket(p)}{p.pos2 ? <span style={{ color: '#5FA88F' }}>/{p.pos2}</span> : null} · {p.tm || p.team}</span>
                    <div style={{ ...MONO, fontSize: 11, color: '#8A959E' }}>{line}</div>
                  </div>
                  <div style={{ textAlign: 'right' }}>
                    <div style={{ color: '#F2A93B', fontWeight: 700 }}>{p.stars}★</div>
                    <div style={{ fontSize: 10, color: '#5FA88F' }}>DRAFT</div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      ) : (
        <div style={{ ...CARD, textAlign: 'center', color: '#8A959E' }}>
          Waiting on {r.name}…
          <button onClick={onSim} style={{ ...BTN, padding: '4px 10px', marginLeft: 8 }}>Advance</button>
        </div>
      )}

      <div style={CARD}>
        <div style={{ ...LABEL, marginBottom: 4 }}>Recent picks</div>
        <div style={{ maxHeight: '22vh', overflowY: 'auto' }}>
          {ds.log.slice().reverse().map((l, i) => (
            <div key={i} style={{ fontSize: 11, color: '#C9D4DB', padding: '2px 0', borderBottom: '1px solid #1c2126' }}>
              R{l.round} · <span style={{ color: ds.rosters[l.team].color }}>{ds.rosters[l.team].name}</span>: {byId[l.pid].name}
              <span style={{ color: '#8A959E' }}> {dPosBucket(byId[l.pid])}·{byId[l.pid].stars}★</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ---------- RANDOMS PHASE UI (Piece 2) ----------
function pStatLine(p) {
  return p.type === 'B' ? (p.pow + '/' + p.con + '/' + p.onb + ' · ' + p.spd + '/' + p.def + '/' + p.arm) : (p.pow + '/' + p.ctl + '/' + p.chg + ' ' + p.throws);
}
function RandomsPhase({ ds, onCommit }) {
  const r = ds.rosters[ds.userIdx];
  // draft context has .picks; a season rollover has no picks, just the carried .roster
  const baseRoster = (r.picks && r.picks.length) ? r.picks : (r.roster || []);
  const [roster, setRoster] = useState(baseRoster.slice());
  const randoms = r.randoms;
  const stars = draftStars(roster);
  const overCap = stars > RANDOM_STAR_CAP;
  const nBat = roster.filter(id => byId[id] && byId[id].type === 'B').length;
  const nPit = roster.filter(id => byId[id] && byId[id].type !== 'B').length;
  const slots = rosterSlots(roster);
  const legal = slots.B === ROSTER_CAPS.B && slots.SP === ROSTER_CAPS.SP && slots.RP === ROSTER_CAPS.RP && !overCap;

  const addPlayer = (id) => setRoster(rs => [...rs, id]);
  const dropPlayer = (id) => setRoster(rs => rs.filter(x => x !== id));

  return (
    <div>
      <div style={CARD}>

function GameRow({ gm, league }) {
  const h = league.rosters[gm.home], a = league.rosters[gm.away];
  return (
    <div style={{ fontSize: 13 }}>
      <span style={{ color: a.color }}>{a.name}</span>
      <span style={{ color: '#8A959E' }}> @ </span>

      {gm.played && gm.result ? <span style={{ color: '#EDEDE3', fontWeight: 700 }}> — {gm.result.awayScore}–{gm.result.homeScore}</span> : null}

}

// Full box score for any completed league game, rendered from the stored result.

  if (!gm || !gm.result) return null;
  const res = gm.result;
  const sides = [
    { key: 'away', r: league.rosters[gm.away], box: res.boxAway, score: res.awayScore },
    { key: 'home', r: league.rosters[gm.home], box: res.boxHome, score: res.homeScore },
  ];
  return (
    <div style={{ ...CARD, borderLeft: '3px solid #F2A93B' }}>

// ---------- PREGAME UI (Piece 4) ----------
function PregameScreen({ league, gameIdx, gm: gmProp, onStart }) {
  const gm = gmProp || league.schedule[gameIdx];
  const myIdx = league.userIdx;
  const iAmHome = gm.home === myIdx;
  const oppIdx = iAmHome ? gm.away : gm.home;
  const myR = league.rosters[myIdx];
  const oppR = league.rosters[oppIdx];
  const mySPs = rosterArms(myR.roster);              // real starters + any two-way arm
  const myBats = myR.roster.filter(id => byId[id] && byId[id].type === 'B');
  const [sp, setSp] = useState(mySPs[0]);
  const oppSPs = rosterArms(oppR.roster).sort((a, b) => byId[b].stars - byId[a].stars);
  const oppProbable = oppSPs[0];
  const FIELD = ['C', '1B', '2B', 'SS', '3B', 'LF', 'CF', 'RF'];

  // ----- auto assignment: returns { lineup:[9 ids in batting order], pos:{spot:id}, dh:id } -----
  const autoAssign = () => {
    const used = new Set(); const pos = {};
    FIELD.forEach(spot => {
      let best = null, bs = -1;
      myBats.forEach(id => {
        if (used.has(id)) return;
        const e = eligibility(byId[id], spot); if (e === null) return;
        const v = (e === 'ok' ? 200 : e === 'bkp' ? 100 : 0) + byId[id].pow + byId[id].con + byId[id].onb;
        if (v > bs) { bs = v; best = id; }
      });
      if (best == null) best = myBats.find(id => !used.has(id));
      pos[spot] = best; used.add(best);
    });
    let dh = null, ds = -1;
    myBats.forEach(id => { if (used.has(id)) return; const v = byId[id].pow + byId[id].con + byId[id].onb; if (v > ds) { ds = v; dh = id; } });
    pos.DH = dh; used.add(dh);
    // batting order: ONB up top, POW middle (autoOrder-style)
    const nine = [...FIELD.map(s => pos[s]), dh];
    const ranked = nine.slice().sort((a, b) => (byId[b].onb + byId[b].con) - (byId[a].onb + byId[a].con));
    const lineup = [ranked[0], ranked[1], ...ranked.slice(2).sort((a, b) => byId[b].pow - byId[a].pow)];
    return { pos, dh, lineup };
  };

  const init = autoAssign();
  const [pos, setPos] = useState(init.pos);       // { spot: playerId }  for the 8 field spots
  const [dh, setDh] = useState(init.dh);          // player id at DH
  const [lineup, setLineup] = useState(init.lineup); // 9 ids in batting order
  const [editPos, setEditPos] = useState(null);   // which field spot is being reassigned

  const doAuto = () => { const a = autoAssign(); setPos(a.pos); setDh(a.dh); setLineup(a.lineup); setEditPos(null); };

  // spot -> player map including DH; the 9 starters are the field players + DH
  const spotOf = (id) => { if (id === dh) return 'DH'; const s = FIELD.find(f => pos[f] === id); return s || '?'; };
  const starters = [...FIELD.map(s => pos[s]), dh];

  const fitFor = (id, spot) => { const e = eligibility(byId[id], spot); return e === 'ok' ? '' : e === 'bkp' ? ' ◐' : e === 'pen' ? ' ⚠' : ' ✗'; };
  const hand = (p) => p.bats === 'S' ? 'S' : p.bats;   // L / R / S

  // assign a player to a field spot (swap if already placed among starters)
  const assignSpot = (spot, id) => {
    // HARD restriction: only catchers may catch (eligibility() returns null = illegal, not a penalty)
    if (eligibility(byId[id], spot) === null) { setEditPos(null); return; }
    setPos(prev => {
      const next = { ...prev };
      const prevOcc = next[spot];              // who was at this spot
      const idPrevSpot = FIELD.find(f => next[f] === id); // where id currently is (field)
      // the displaced player must legally take the vacated spot, or the swap is illegal
      if (idPrevSpot && prevOcc && eligibility(byId[prevOcc], idPrevSpot) === null) return prev;
      if (idPrevSpot) next[idPrevSpot] = prevOcc;         // swap within field
      else if (id === dh) setDh(prevOcc);                 // id was DH -> DH gets displaced player
      next[spot] = id;
      return next;
    });
    setEditPos(null);
  };
  const assignDH = (id) => {
    const prevDh = dh;
    const idField = FIELD.find(f => pos[f] === id);
    if (idField) setPos(prev => ({ ...prev, [idField]: prevDh }));
    setDh(id);
    setEditPos(null);
  };

  // batting order reorder
  // NOTE: must act on the order actually being rendered (orderToUse), not the raw `lineup`
  // state — they can diverge after a position change, which made some slots unresponsive.
  const moveInOrder = (i, dir) => {
    const cur = orderToUse.slice();
    const j = i + dir;
    if (j < 0 || j >= cur.length) return;
    const t = cur[i]; cur[i] = cur[j]; cur[j] = t;
    setLineup(cur);
  };

  // sync: lineup must contain exactly the 9 starters. If positions changed, keep order but
  // replace any dropped starter. Rebuild lineup preserving relative order of survivors.
  const syncedLineup = (() => {
    const set = new Set(starters);
    const kept = lineup.filter(id => set.has(id));
    const missing = starters.filter(id => !kept.includes(id));
    return [...kept, ...missing];
  })();
  const orderToUse = syncedLineup;

  const legal = new Set(starters).size === 9 && starters.every(id => id != null);

  // build the payload teamFromRoster expects: 9 ids aligned to [C,1B,2B,SS,3B,LF,CF,RF,DH] BUT
  // in batting order. teamFromRoster reads lineup[i] as the batter hitting i+1 AND as the fielder
  // for FIELD[i]. So we must pass positions in batting-order slots. We supply a richer payload.
  const startGame = () => {
    const battingOrder = orderToUse.slice();          // 9 ids, batting sequence
    const posMap = { ...pos, DH: dh };                // spot -> id
    onStart(sp, { battingOrder, posMap });
  };

  return (
    <div>
      <div style={CARD}>
        <div style={{ ...LABEL }}>{iAmHome ? 'Home' : 'Away'} · Game {gameIdx != null ? gameIdx + 1 : ''}</div>
        <div style={{ fontSize: 16, fontWeight: 800 }}>
          <span style={{ color: oppR.color }}>{oppR.name}</span>
          <span style={{ color: '#8A959E' }}> vs </span>
          <span style={{ color: myR.color }}>{myR.name}</span>
        </div>
        {oppProbable ? <div style={{ fontSize: 12, color: '#8A959E', marginTop: 6 }}>
          Opposing starter: <span style={{ color: '#EDEDE3' }}>{byId[oppProbable].name}</span>
          <span style={{ ...MONO }}> {byId[oppProbable].throws}HP · {byId[oppProbable].pow}/{byId[oppProbable].ctl}/{byId[oppProbable].chg} · {byId[oppProbable].stars}★</span>
        </div> : null}
      </div>

      <div style={CARD}>
        <div style={{ ...LABEL, marginBottom: 2 }}>Your starting pitcher</div>
        <div style={{ fontSize: 10, color: '#5b6870', marginBottom: 6 }}>Fatigue carries over between games — a tired arm is weaker. Starters are forced out past 4.</div>
        {mySPs.map(id => {
          const p = byId[id];
          const c = (myR.fatigue && myR.fatigue[id]) || 0;
          const eff = pitEff(p, c);
          const worn = c > 0;
          const done = c >= 5;
          const cColor = c === 0 ? '#5FA88F' : c >= 4 ? '#E63946' : '#F2A93B';
          return (
            <div key={id} onClick={() => { if (!done) setSp(id); }} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px 6px', borderBottom: '1px solid #22282e', cursor: done ? 'not-allowed' : 'pointer', background: sp === id ? '#2A3138' : 'transparent', borderRadius: 6, opacity: done ? 0.4 : 1 }}>
              <span style={{ color: '#EDEDE3', fontWeight: sp === id ? 700 : 400 }}>
                {p.name}
                {p.twoWayOf ? <span style={{ ...MONO, fontSize: 9, color: '#F2A93B', marginLeft: 5 }}>2-WAY</span> : null}
                <span style={{ ...MONO, fontSize: 10, color: cColor, marginLeft: 6 }}>
                  {c === 0 ? 'FRESH' : done ? 'GASSED' : c + ' CLK'}
                </span>
              </span>
              <span style={{ ...MONO, fontSize: 11, color: '#8A959E' }}>
                {p.throws}HP · {worn
                  ? <span><span style={{ textDecoration: 'line-through', color: '#5b6870' }}>{p.pow}/{p.ctl}/{p.chg}</span> <span style={{ color: '#F2A93B' }}>{eff.pow}/{eff.ctl}/{eff.chg}</span></span>
                  : <span>{p.pow}/{p.ctl}/{p.chg}</span>} · {p.stars}★
              </span>
            </div>
          );
        })}
      </div>

      <button onClick={doAuto} style={{ ...BTN, width: '100%', padding: 8, marginBottom: 10, fontSize: 12 }}>Auto-fill lineup and positions</button>

      {/* ===== FIELDING POSITIONS ===== */}
      <div style={CARD}>
        <div style={{ ...LABEL, marginBottom: 2 }}>Fielding positions</div>
        <div style={{ fontSize: 10, color: '#5b6870', marginBottom: 6 }}>Tap any spot to pick from your full {myBats.length}-player roster.</div>
        {[...FIELD, 'DH'].map(spot => {
          const id = spot === 'DH' ? dh : pos[spot];
          const p = id ? byId[id] : null;
          const editing = editPos === spot;
          return (
            <div key={spot}>
              <div onClick={() => setEditPos(editing ? null : spot)} style={{ display: 'flex', alignItems: 'center', padding: '7px 4px', borderBottom: '1px solid #22282e', cursor: 'pointer', background: editing ? '#2A3138' : 'transparent' }}>
                <span style={{ width: 38, ...MONO, fontSize: 12, color: '#F2A93B', fontWeight: 700 }}>{spot}</span>
                <span style={{ flex: 1, color: p ? '#EDEDE3' : '#5b6870' }}>
                  {p ? p.name : 'tap to assign'}
                  {p ? <span style={{ color: '#8A959E', fontSize: 10 }}> ({p.pos}{p.pos2 ? '/' + p.pos2 : ''}){spot !== 'DH' ? fitFor(id, spot) : ''}</span> : null}
                  {p ? (() => { const h = (myR.heat && myR.heat[id]) || 0; return h ? <span style={{ ...MONO, fontSize: 10, fontWeight: 700, color: h > 0 ? '#5FA88F' : '#E63946' }}> {h > 0 ? '+' + h : h}</span> : null; })() : null}
                </span>
                {p ? (() => { const h = (myR.heat && myR.heat[id]) || 0; const e = batEff(p, h); return <span style={{ ...MONO, fontSize: 10, color: '#8A959E' }}>{hand(p)} {e.pow}/{e.con}/{e.onb} <span style={{ color: '#5FA88F' }}>{p.spd}/{p.def}/{p.arm}</span></span>; })() : null}
              </div>
              {editing ? (
                <div style={{ background: '#14181c', padding: 6, maxHeight: '32vh', overflowY: 'auto' }}>
                  <div style={{ fontSize: 10, color: '#8A959E', padding: '2px 8px 6px' }}>All {myBats.length} players — starters show their current spot at right</div>
                  {myBats.map(bid => {
                    const bp = byId[bid];
                    const at = spotOf(bid);
                    const isStarter = starters.includes(bid);
                    return (
                      <div key={bid} onClick={() => { if (spot !== 'DH' && eligibility(bp, spot) === null) return; spot === 'DH' ? assignDH(bid) : assignSpot(spot, bid); }} style={{ display: 'flex', justifyContent: 'space-between', padding: '5px 8px', fontSize: 12, cursor: 'pointer', opacity: (spot !== 'DH' && eligibility(bp, spot) === null) ? 0.35 : 1 }}>
                        <span style={{ color: '#EDEDE3' }}>{bp.name} <span style={{ color: '#8A959E', fontSize: 10 }}>({bp.pos}{bp.pos2 ? '/' + bp.pos2 : ''}){spot !== 'DH' ? fitFor(bid, spot) : ''}</span></span>
                        <span style={{ ...MONO, fontSize: 10, color: '#8A959E' }}>{hand(bp)} {(() => { const h = (myR.heat && myR.heat[bid]) || 0; const e = batEff(bp, h); return e.pow + '/' + e.con + '/' + e.onb + (h ? (h > 0 ? ' +' + h : ' ' + h) : ''); })()} {isStarter ? '· @' + at : ''}</span>
                      </div>
                    );
                  })}
                </div>
              ) : null}
            </div>
          );
        })}
        <div style={{ fontSize: 10, color: '#5b6870', marginTop: 6 }}>Green = SPD/DEF/ARM. ◐ = backup position (−1 DEF). ⚠ = out of position (−2 DEF). Only catchers may catch. Assigning a starter elsewhere swaps the two.</div>
      </div>

      {/* ===== BATTING ORDER ===== */}
      <div style={CARD}>
        <div style={{ ...LABEL, marginBottom: 2 }}>Batting order</div>
        <div style={{ fontSize: 10, color: '#5b6870', marginBottom: 6 }}>Arrows reorder. These are your 9 starters (8 fielders + DH); to change who starts, use Fielding positions above. Green/red = current hot/cold streak.</div>
        {orderToUse.map((id, i) => {
          const p = byId[id];
          return (
            <div key={id} style={{ display: 'flex', alignItems: 'center', padding: '6px 4px', borderBottom: '1px solid #22282e' }}>
              <span style={{ width: 18, color: '#8A959E', fontSize: 12 }}>{i + 1}</span>
              <span style={{ width: 30, ...MONO, fontSize: 10, color: '#F2A93B' }}>{spotOf(id)}</span>
              <span style={{ flex: 1, color: '#EDEDE3', fontSize: 13 }}>{p.name} <span style={{ color: '#5b6870', fontSize: 10 }}>{p.pos}{p.pos2 ? <span style={{ color: '#5FA88F' }}>/{p.pos2}</span> : null}</span></span>
              {(() => {
                const h = (myR.heat && myR.heat[id]) || 0;
                if (!h) return <span style={{ width: 30 }} />;
                return <span style={{ width: 30, ...MONO, fontSize: 10, textAlign: 'right', fontWeight: 700,
                  color: h > 0 ? '#5FA88F' : '#E63946' }}>{h > 0 ? '+' + h : h}</span>;
              })()}
              <span style={{ ...MONO, fontSize: 10, color: '#8A959E', marginRight: 8, marginLeft: 6 }}>{hand(p)} {p.pow}/{p.con}/{p.onb} {p.spd}/{p.def}/{p.arm}</span>
              <button onClick={() => moveInOrder(i, -1)} disabled={i === 0} style={{ ...BTN, padding: '2px 7px', fontSize: 12, opacity: i === 0 ? 0.3 : 1 }}>↑</button>
              <button onClick={() => moveInOrder(i, 1)} disabled={i === 8} style={{ ...BTN, padding: '2px 7px', fontSize: 12, marginLeft: 3, opacity: i === 8 ? 0.3 : 1 }}>↓</button>
            </div>
          );
        })}
        {(() => {
          const benchList = myBats.filter(id => !starters.includes(id));
          if (benchList.length === 0) return null;
          return <div style={{ fontSize: 10, color: '#5b6870', marginTop: 6 }}>Bench ({benchList.length}): {benchList.map(id => byId[id].name + ' (' + byId[id].pos + (byId[id].pos2 ? '/' + byId[id].pos2 : '') + ')').join(', ')}</div>;
        })()}
      </div>

      <button onClick={startGame} disabled={!legal} style={{ ...BTN, width: '100%', padding: 12, fontWeight: 700, background: legal ? '#F2A93B' : '#2A3138', color: legal ? '#111417' : '#5b6870', border: 'none' }}>Play ball</button>
    </div>
  );
}

// ---------- LEADERS VIEW (Piece 5) ----------
function LeadersView({ league }) {
  const [tab, setTab] = useState('bat');
  const [scope, setScope] = useState('season');   // 'season' | 'alltime'
  const [sortKey, setSortKey] = useState('hr');
  const seasonAgg = aggregateLeaders(league);
  const haveAllTime = !!(league.allTime && (Object.keys(league.allTime.bat || {}).length || Object.keys(league.allTime.pit || {}).length));
  // all-time = every completed season, PLUS the season currently in progress
  const combined = (() => {
    if (!haveAllTime) return seasonAgg;
    const out = { bat: {}, pit: {} };
    ['bat', 'pit'].forEach(side => {
      const keys = side === 'bat' ? BAT_KEYS : PIT_KEYS;
      const src1 = (league.allTime[side] || {}), src2 = (seasonAgg[side] || {});
      new Set([...Object.keys(src1), ...Object.keys(src2)]).forEach(id => {
        out[side][id] = keys.reduce((o, k) => {
          o[k] = ((src1[id] && src1[id][k]) || 0) + ((src2[id] && src2[id][k]) || 0);
          return o;
        }, {});
      });
    });
    return out;
  })();
  const agg = scope === 'alltime' ? combined : seasonAgg;
  const batRows = Object.keys(agg.bat).filter(id => byId[id]).map(id => {
    const s = agg.bat[id];
    return { id, name: byId[id].name, ...s, avg: s.ab > 0 ? s.h / s.ab : 0, obp: s.pa > 0 ? s.ob / s.pa : 0 };
  });
  const pitRows = Object.keys(agg.pit).filter(id => byId[id]).map(id => {
    const s = agg.pit[id];
    const ip = s.outs / 3;
    return { id, name: byId[id].name, ...s, ip, ra9: ip > 0 ? (s.r * 9) / ip : 0 };
  });
  const batCols = [['h', 'H'], ['hr', 'HR'], ['rbi', 'RBI'], ['r', 'R'], ['sb', 'SB'], ['bb', 'BB'], ['k', 'K'], ['avg', 'AVG'], ['obp', 'OBP']];
  const pitCols = [['ip', 'IP'], ['k', 'K'], ['r', 'R'], ['ra9', 'RA9']];
  const rows = tab === 'bat' ? batRows : pitRows;
  const cols = tab === 'bat' ? batCols : pitCols;
  rows.sort((a, b) => (b[sortKey] || 0) - (a[sortKey] || 0));
  const top = rows.slice(0, 20);
  const fmt = (v, k) => (k === 'avg' || k === 'obp') ? v.toFixed(3).replace(/^0/, '') : (k === 'ra9' || k === 'ip') ? v.toFixed(1) : v;
  return (
    <div style={{ ...CARD, overflowX: 'auto' }}>
      <div style={{ display: 'flex', gap: 5, marginBottom: 6 }}>
        <button onClick={() => setScope('season')} style={{ ...BTN, flex: 1, padding: '5px 0', fontSize: 11, background: scope === 'season' ? '#2A3138' : '#1A1F24', color: scope === 'season' ? '#F2A93B' : '#8A959E', fontWeight: scope === 'season' ? 700 : 400 }}>This Season</button>
        <button onClick={() => setScope('alltime')} style={{ ...BTN, flex: 1, padding: '5px 0', fontSize: 11, background: scope === 'alltime' ? '#2A3138' : '#1A1F24', color: scope === 'alltime' ? '#F2A93B' : '#8A959E', fontWeight: scope === 'alltime' ? 700 : 400 }}>All-Time</button>
      </div>
      <div style={{ display: 'flex', gap: 5, marginBottom: 8 }}>
        <button onClick={() => { setTab('bat'); setSortKey('hr'); }} style={{ ...BTN, flex: 1, padding: '6px 0', fontSize: 12, background: tab === 'bat' ? '#2A3138' : '#1A1F24' }}>Batting</button>
        <button onClick={() => { setTab('pit'); setSortKey('k'); }} style={{ ...BTN, flex: 1, padding: '6px 0', fontSize: 12, background: tab === 'pit' ? '#2A3138' : '#1A1F24' }}>Pitching</button>
      </div>
      {scope === 'alltime' ? <div style={{ fontSize: 10, color: '#5b6870', marginBottom: 6 }}>Career totals across {(league.history || []).length} completed season{(league.history || []).length === 1 ? '' : 's'} plus the current one.</div> : null}
      <table style={{ ...MONO, width: '100%', fontSize: 11, borderCollapse: 'collapse' }}>
        <thead><tr style={{ color: '#8A959E', textAlign: 'right' }}>
          <th style={{ textAlign: 'left' }}>Player</th><th>G</th>
          {cols.map(([k, l]) => <th key={k} onClick={() => setSortKey(k)} style={{ cursor: 'pointer', color: sortKey === k ? '#F2A93B' : '#8A959E' }}>{l}</th>)}
        </tr></thead>
        <tbody>
          {top.map(r => (
            <tr key={r.id} style={{ borderTop: '1px solid #22282e', textAlign: 'right' }}>
              <td style={{ textAlign: 'left', color: '#C9D4DB' }}>{r.name}</td>
              <td style={{ color: '#5b6870' }}>{r.g}</td>
              {cols.map(([k]) => <td key={k} style={{ color: sortKey === k ? '#F2A93B' : '#C9D4DB' }}>{fmt(r[k], k)}</td>)}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

            {po.playin.played
              ? <span style={{ fontWeight: 700 }}>{po.playin.result.awayScore}–{po.playin.result.homeScore}</span>

        <div style={CARD}>
          <div style={{ ...LABEL, marginBottom: 6 }}>Championship — first to 2</div>

            <div key={i} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, padding: '3px 0' }}>

            return <button onClick={() => mine ? onPlay('final:' + ni) : onSim('final:' + ni)} style={{ ...BTN, width: '100%', padding: 10, marginTop: 8, background: mine ? '#F2A93B' : '#1A1F24', color: mine ? '#111417' : '#EDEDE3', border: 'none', fontWeight: 700 }}>{mine ? 'Play' : 'Sim'} Game {ni + 1}</button>;

      ) : null}

  );
}

// Pick-N from a set of random players, awarded for winning a series.
// Start of a ladder run: pick 3 of 5 fixed players to seed your club before the opener.
function LadderStartDraft({ L, onConfirm }) {
  const sd = L.startDraft;
  const [chosen, setChosen] = useState([]);
  const toggle = (id) => setChosen(c =>
    c.includes(id) ? c.filter(x => x !== id) : (c.length < sd.take ? [...c, id] : c));
  const done = chosen.length === sd.take;
  return (
    <div>
      <div style={{ ...CARD, borderLeft: '3px solid #F2A93B', textAlign: 'center' }}>
        <div style={{ fontSize: 18, fontWeight: 800, color: '#F2A93B' }}>Build your club</div>
        <div style={{ fontSize: 12, color: '#8A959E', marginTop: 4 }}>
          Draft <b style={{ color: '#EDEDE3' }}>{sd.take}</b> of these {sd.choices.length} players to join your roster before the opener. The rest of your lineup fills in with replacements.
        </div>
      </div>
      {sd.choices.filter(id => byId[id]).map(id => {
        const p = byId[id];
        const on = chosen.includes(id);
        const full = !on && chosen.length >= sd.take;
        return (
          <div key={id} onClick={() => toggle(id)} style={{ ...CARD, marginBottom: 8, cursor: full ? 'default' : 'pointer',
            border: on ? '2px solid #F2A93B' : '1px solid #2A3138', opacity: full ? 0.5 : 1,
            display: 'flex', alignItems: 'center', gap: 10 }}>
            <span style={{ width: 22, color: on ? '#F2A93B' : '#5b6870', fontWeight: 800, fontSize: 18 }}>{on ? '✓' : '+'}</span>
            <span style={{ ...MONO, color: '#F2A93B', fontWeight: 800 }}>{p.stars}★</span>
            <span style={{ flex: 1 }}>
              <div style={{ color: '#EDEDE3', fontWeight: 700, fontSize: 14 }}>{p.name} <span style={{ ...MONO, fontSize: 10, color: '#5b6870' }}>{p.team}</span></div>
              <div style={{ ...MONO, fontSize: 10, color: '#8A959E' }}>
                {p.type === 'B'
                  ? <span>{handTag(p)} · {p.pos}{p.pos2 ? <span style={{ color: '#5FA88F' }}>/{p.pos2}</span> : null} · {p.pow}/{p.con}/{p.onb} · <span style={{ color: '#5FA88F' }}>{p.spd}/{p.def}/{p.arm}</span></span>
                  : <span>{p.type} · {p.throws}HP · {p.pow}/{p.ctl}/{p.chg}</span>}
              </div>
            </span>
          </div>
        );
      })}
      <button onClick={() => onConfirm(chosen)} disabled={!done}
        style={{ ...BTN, width: '100%', padding: 12, fontWeight: 700,
          background: done ? '#F2A93B' : '#2A3138', color: done ? '#111417' : '#5b6870', border: 'none' }}>
        {done ? 'Start the run' : `Pick ${sd.take - chosen.length} more`}
      </button>
    </div>
  );
}
// Start of a ladder run: pick 3 of 5 fixed players to seed your club before the opener.
function LadderReward({ L, onConfirm }) {
  const rd = L.rewardDraft;
  const [chosen, setChosen] = useState([]);
  const toggle = (id) => setChosen(c =>
    c.includes(id) ? c.filter(x => x !== id) : (c.length < rd.take ? [...c, id] : c));
  const done = chosen.length === rd.take;
  return (
    <div>
      <div style={{ ...CARD, borderLeft: '3px solid #5FA88F', textAlign: 'center' }}>
        <div style={{ fontSize: 18, fontWeight: 800, color: '#5FA88F' }}>Series won!</div>
        <div style={{ fontSize: 12, color: '#8A959E', marginTop: 4 }}>
          {rd.mixed
            ? <span>Take any <b style={{ color: '#EDEDE3' }}>{rd.take}</b> — unlocked legends, star boosts, or a mix.</span>
            : <span>Draft <b style={{ color: '#EDEDE3' }}>{rd.take}</b> of these {rd.choices.length} {rd.star}★ players to join your club.</span>}
        </div>
      </div>
      {rd.choices.filter(id => byId[id] || String(id).indexOf('__boost') === 0).map(id => {
        if (String(id).indexOf('__boost') === 0) {
          const on = chosen.includes(id);
          const full = !on && chosen.length >= rd.take;
          return (
            <div key={id} onClick={() => toggle(id)} style={{ ...CARD, marginBottom: 8, cursor: full ? 'default' : 'pointer',
              border: on ? '2px solid #F2A93B' : '1px solid #2A3138', opacity: full ? 0.5 : 1,
              display: 'flex', alignItems: 'center', gap: 10 }}>
              <span style={{ width: 22, color: on ? '#F2A93B' : '#5b6870', fontWeight: 800, fontSize: 18 }}>{on ? '✓' : '+'}</span>
              <span style={{ ...MONO, color: '#F2A93B', fontWeight: 800 }}>★+</span>
              <span style={{ flex: 1 }}>
                <div style={{ color: '#EDEDE3', fontWeight: 700, fontSize: 14 }}>Star boost</div>
                <div style={{ ...MONO, fontSize: 10, color: '#8A959E' }}>raise any player on your roster one star</div>
              </span>
            </div>
          );
        }
        const p = byId[id];
        const on = chosen.includes(id);
        const full = !on && chosen.length >= rd.take;
        return (
          <div key={id} onClick={() => toggle(id)} style={{ ...CARD, marginBottom: 8, cursor: full ? 'default' : 'pointer',
            border: on ? '2px solid #5FA88F' : '1px solid #2A3138', opacity: full ? 0.5 : 1,
            display: 'flex', alignItems: 'center', gap: 10 }}>
            <span style={{ width: 22, color: on ? '#5FA88F' : '#5b6870', fontWeight: 800, fontSize: 18 }}>{on ? '✓' : '+'}</span>
            <span style={{ ...MONO, color: '#F2A93B', fontWeight: 800 }}>{p.stars}★</span>
            <span style={{ flex: 1 }}>
              <div style={{ color: '#EDEDE3', fontWeight: 700, fontSize: 14 }}>{p.name}</div>
              <div style={{ ...MONO, fontSize: 10, color: '#8A959E' }}>
                {p.type === 'B'
                  ? <span>{handTag(p)} · {p.pos}{p.pos2 ? <span style={{ color: '#5FA88F' }}>/{p.pos2}</span> : null} · {p.pow}/{p.con}/{p.onb} · <span style={{ color: '#5FA88F' }}>{p.spd}/{p.def}/{p.arm}</span></span>
                  : <span>{p.type} · {p.throws}HP · {p.pow}/{p.ctl}/{p.chg}</span>}
              </div>
            </span>
          </div>
        );
      })}
      <button onClick={() => onConfirm(chosen)} disabled={!done}
        style={{ ...BTN, width: '100%', padding: 12, fontWeight: 700,
          background: done ? '#5FA88F' : '#2A3138', color: done ? '#111417' : '#5b6870', border: 'none' }}>
        {done ? 'Add to roster' : `Pick ${rd.take - chosen.length} more`}
      </button>
    </div>
  );
}

// Pick-N from a set of random players, awarded for winning a series.
function LadderHub({ L, onPlay, onBuy, onPack, onCut, onReveal, onQuit, onBoost }) {
  const cfg = ladderCfg(L);
  const [showStats, setShowStats] = useState(false);
  const [boostId, setBoostId] = useState(null);
  const [bPicks, setBPicks] = useState({ stats: [], field: [] });
  const need = cfg.need;
  const oppLabel = cfg.oppStar === 0 ? '0★ replacements' : cfg.oppStar >= 4 ? '4–5★ legends' : cfg.oppStar + '★ squad';
  const mustCut = L.pending.length > 0 || !ladderRosterLegal(L.roster);
  const starTotal = L.roster.reduce((a, id) => a + (byId[id] ? byId[id].stars : 0), 0);

  // reveal overlay: shows what a just-opened pack/purchase gave you, then sends you to the cut screen
  if (L.lastPack && L.lastPack.length) {
    return (
      <div style={{ padding: '20px 4px' }}>
        <div style={{ ...CARD, borderLeft: '3px solid #F2A93B', textAlign: 'center' }}>
          <div style={{ ...LABEL, marginBottom: 10 }}>You acquired</div>
          {L.lastPack.filter(id => byId[id]).map(id => {
            const p = byId[id];
            return (
              <div key={id} style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, padding: '8px 0' }}>
                <span style={{ ...MONO, color: '#F2A93B', fontWeight: 800, fontSize: 16 }}>{p.stars}★</span>
                <span style={{ color: '#EDEDE3', fontWeight: 700, fontSize: 15 }}>{p.name}</span>
                <span style={{ color: '#8A959E', fontSize: 12 }}>
                  {p.type === 'B' ? p.pos + ' · ' + p.pow + '/' + p.con + '/' + p.onb : p.type + ' · ' + p.pow + '/' + p.ctl + '/' + p.chg}
                </span>
              </div>
            );
          })}
        </div>
        <button onClick={onReveal} style={{ ...BTN, width: '100%', padding: 12, fontWeight: 700, background: '#F2A93B', color: '#111417', border: 'none' }}>
          Set your roster
        </button>
      </div>
    );
  }

  if (L.over) {
    return (
      <div>
        <div style={{ ...CARD, textAlign: 'center', borderLeft: '3px solid ' + (L.won ? '#5FA88F' : '#E63946') }}>
          <div style={{ fontSize: 20, fontWeight: 800, color: L.won ? '#5FA88F' : '#E63946', marginBottom: 6 }}>
            {L.won ? 'YOU BEAT THE LADDER' : 'RUN OVER'}
          </div>
          <div style={{ fontSize: 12, color: '#8A959E' }}>
            {L.won ? 'You took down The Show.' : 'You lost the ' + cfg.name + ' series. The ladder resets.'}
          </div>
        </div>
        <button onClick={onQuit} style={{ ...BTN, width: '100%', padding: 12, fontWeight: 700, background: '#F2A93B', color: '#111417', border: 'none' }}>Start a new run</button>
      </div>
    );
  }

  return (
    <div>
      {(L.roundsWon || 0) > 0 ? (
        <div style={{ ...CARD, borderLeft: '3px solid #5FA88F', padding: '8px 12px' }}>
          <div style={{ fontSize: 12, color: '#5FA88F', fontWeight: 700 }}>
            {L.roundsWon} round{L.roundsWon > 1 ? 's' : ''} won · series bonuses scaled down by level
            {(L.legendPool || []).length ? ' · ' + L.legendPool.length + ' legend' + (L.legendPool.length > 1 ? 's' : '') + ' unlocked' : ''}
          </div>
        </div>
      ) : null}
      {/* series header */}
      <div style={{ ...CARD, borderLeft: '3px solid #F2A93B' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
          <div>
            <div style={{ ...LABEL }}>Round {L.round || 1} · Level {cfg.lvl} of 5 · {cfg.name}</div>
            <div style={{ fontSize: 15, fontWeight: 800 }}>
              vs <span style={{ color: L.opponent.color }}>{L.opponent.name}</span>
              <span style={{ fontSize: 11, color: '#8A959E', fontWeight: 400 }}> ({oppLabel})</span>
            </div>
          </div>
          <div style={{ textAlign: 'right' }}>
            <div style={{ ...MONO, fontSize: 20, fontWeight: 800, color: '#F2A93B' }}>{L.tokens}</div>
            <div style={{ fontSize: 9, color: '#8A959E' }}>TOKENS</div>
            {(L.boosts || 0) > 0 ? <div style={{ ...MONO, fontSize: 12, color: '#5FA88F', marginTop: 3 }}>{L.boosts} boost{L.boosts > 1 ? 's' : ''}</div> : null}
          </div>
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center', marginTop: 8 }}>
          <span style={{ ...MONO, fontSize: 13, color: '#EDEDE3' }}>{L.series.wins} – {L.series.losses}</span>
          <span style={{ fontSize: 11, color: '#8A959E' }}>best of {cfg.bestOf} · first to {need}</span>
        </div>
        <div style={{ display: 'flex', gap: 3, marginTop: 6 }}>
          {Array.from({ length: cfg.bestOf }).map((_, i) => {
            const g = L.series.games[i];
            const bg = !g ? '#22282e' : g.won ? '#5FA88F' : '#E63946';
            return <div key={i} style={{ flex: 1, height: 5, background: bg, borderRadius: 3 }} />;
          })}
        </div>
        <div style={{ fontSize: 10, color: '#5b6870', marginTop: 6 }}>
          Win a game: +{cfg.perWin} tokens. Win the series: +{cfg.bonus} tokens{cfg.reward ? ' and draft 3 of 5 ' + cfg.reward + '★ players' : ' — and you win the ladder'}.
        </div>
      </div>

      {mustCut ? (
        <div style={{ ...CARD, borderLeft: '3px solid #E63946' }}>
          <div style={{ ...LABEL, marginBottom: 4, color: '#E63946' }}>Roster needs attention</div>
          <div style={{ fontSize: 11, color: '#C9D4DB', marginBottom: 8 }}>
            You must carry exactly 11 batters, 3 SP and 3 RP (17 total).
            {L.pending.length ? ' You have ' + L.pending.length + ' new player' + (L.pending.length === 1 ? '' : 's') + ' to fit in.' : ''}
          </div>
          <button onClick={onCut} style={{ ...BTN, width: '100%', padding: 10, fontWeight: 700, background: '#E63946', color: '#fff', border: 'none' }}>Set your roster</button>
        </div>
      ) : (
        <button onClick={onPlay} style={{ ...BTN, width: '100%', padding: 12, marginBottom: 10, fontWeight: 700, background: '#F2A93B', color: '#111417', border: 'none', fontSize: 14 }}>
          Play game {L.series.games.length + 1}
        </button>
      )}


      {/* star boosts */}
      <div style={CARD}>
        <div style={{ ...LABEL, marginBottom: 2 }}>Star boost</div>
        <div style={{ fontSize: 10, color: '#5b6870', marginBottom: 8 }}>
          Raise a player one star and add to his card. Batters pick 2 hitting stats + 1 fielding stat; pitchers pick 1 (2 going to 3★).
          Hitting caps at 7 and pitching at 10 — a 5★ boost lifts those to 8 and 11. He keeps his current heat.
        </div>
        {(() => {
          const bp = boostId ? byId[boostId] : null;
          if (bp) {
            const need = boostPicks(bp, bp.stars);
            const ns = bp.stars + 1;
            const kind = bp.type === 'B' ? 'bat' : 'pit';
            const statKeys = bp.type === 'B' ? ['pow', 'con', 'onb'] : ['pow', 'ctl', 'chg'];
            const fieldKeys = ['spd', 'def', 'arm'];
            const cap = boostCap(ns, kind);
            const toggle = (arr, k, lim) => arr.includes(k) ? arr.filter(x => x !== k) : (arr.length < lim ? [...arr, k] : arr);
            const ready = bPicks.stats.length === need.stats && bPicks.field.length === need.field;
            const cost = boostCost(bp.stars);
            const free = (L.boosts || 0) > 0;
            const label = { pow: 'POW', con: 'CON', onb: 'ONB', ctl: 'SPN', chg: 'CHG', spd: 'SPD', def: 'DEF', arm: 'ARM' };
            return (
              <div>
                <div style={{ fontWeight: 700, color: '#EDEDE3', marginBottom: 6 }}>
                  {bp.name} <span style={{ ...MONO, fontSize: 10, color: '#8A959E' }}>{handTag(bp)}{bp.type === 'B' ? ' · ' + bp.pos : ' · ' + bp.type}</span> <span style={{ ...MONO, color: '#F2A93B' }}>{bp.stars}★ → {ns}★</span>
                </div>
                <div style={{ fontSize: 11, color: '#8A959E', marginBottom: 4 }}>Pick {need.stats} to raise:</div>
                <div style={{ display: 'flex', gap: 6, marginBottom: 8 }}>
                  {statKeys.map(k => {
                    const on = bPicks.stats.includes(k);
                    const maxed = (bp[k] || 0) >= cap;
                    return <button key={k} disabled={maxed} onClick={() => setBPicks(v => ({ ...v, stats: toggle(v.stats, k, need.stats) }))}
                      style={{ ...BTN, flex: 1, padding: 8, opacity: maxed ? 0.35 : 1, background: on ? '#F2A93B' : '#1A1F24', color: on ? '#111417' : '#EDEDE3', fontWeight: 700 }}>
                      {label[k]} {bp[k]}{on ? '→' + Math.min(cap, bp[k] + 1) : ''}
                    </button>;
                  })}
                </div>
                {need.field > 0 ? (
                  <div>
                    <div style={{ fontSize: 11, color: '#8A959E', marginBottom: 4 }}>Pick {need.field} fielding stat:</div>
                    <div style={{ display: 'flex', gap: 6, marginBottom: 8 }}>
                      {fieldKeys.map(k => {
                        const on = bPicks.field.includes(k);
                        return <button key={k} onClick={() => setBPicks(v => ({ ...v, field: toggle(v.field, k, need.field) }))}
                          style={{ ...BTN, flex: 1, padding: 8, background: on ? '#5FA88F' : '#1A1F24', color: on ? '#111417' : '#EDEDE3', fontWeight: 700 }}>
                          {label[k]} {bp[k]}{on ? '→' + (bp[k] + 1) : ''}
                        </button>;
                      })}
                    </div>
                  </div>
                ) : null}
                <div style={{ display: 'flex', gap: 6 }}>
                  <button onClick={() => { setBoostId(null); setBPicks({ stats: [], field: [] }); }}
                    style={{ ...BTN, flex: 1, padding: 10 }}>Cancel</button>
                  <button disabled={!ready} onClick={() => { onBoost(boostId, bPicks); setBoostId(null); setBPicks({ stats: [], field: [] }); }}
                    style={{ ...BTN, flex: 2, padding: 10, fontWeight: 700, border: 'none',
                      background: ready ? '#F2A93B' : '#2A3138', color: ready ? '#111417' : '#5b6870' }}>
                    {ready ? (free ? 'Use a boost credit' : 'Boost for ' + cost) : 'Pick ' + (need.stats + need.field - bPicks.stats.length - bPicks.field.length) + ' more'}
                  </button>
                </div>
              </div>
            );
          }
          const cands = L.roster.map(id => byId[id]).filter(q => q && q.stars >= 1 && q.stars < 5);
          if (!cands.length) return <div style={{ fontSize: 11, color: '#5b6870' }}>No one on the roster can be boosted yet — you need a rated player first.</div>;
          return (
            <div>
              {cands.sort((a, b) => b.stars - a.stars).map(q => {
                const cost = boostCost(q.stars);
                const free = (L.boosts || 0) > 0;
                const afford = free || L.tokens >= cost;
                return (
                  <div key={q.id} onClick={() => afford && setBoostId(q.id)}
                    style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '6px 0', borderBottom: '1px solid #1A1F24',
                      opacity: afford ? 1 : 0.4, cursor: afford ? 'pointer' : 'default' }}>
                    <span style={{ ...MONO, color: '#F2A93B', fontWeight: 800 }}>{q.stars}★</span>
                    <span style={{ flex: 1, color: '#EDEDE3', fontSize: 13 }}>{q.name}
                      <span style={{ ...MONO, fontSize: 10, color: '#8A959E' }}> {handTag(q)} · {q.type === 'B' ? q.pos : q.type}</span>
                    </span>
                    <span style={{ ...MONO, fontSize: 12, color: free ? '#5FA88F' : afford ? '#F2A93B' : '#5b6870' }}>
                      {free ? 'FREE' : cost}
                    </span>
                  </div>
                );
              })}
            </div>
          );
        })()}
      </div>

      {/* shop */}
      <div style={CARD}>
        <div style={{ ...LABEL, marginBottom: 2 }}>Player shop</div>
        <div style={{ fontSize: 10, color: '#5b6870', marginBottom: 8 }}>Buying a slot sells it out until the shop restocks after your next game. Packs can be bought any number of times.</div>
        {L.shop.slots.map(s => {
          const p = s.id ? byId[s.id] : null;
          const afford = L.tokens >= s.price && !!p;
          return (
            <div key={s.star} style={{ display: 'flex', alignItems: 'center', padding: '7px 2px', borderBottom: '1px solid #22282e', opacity: p ? 1 : 0.35 }}>
              <span style={{ ...MONO, width: 26, color: '#F2A93B', fontWeight: 700 }}>{s.star}★</span>
              <span style={{ flex: 1, fontSize: 12, color: '#EDEDE3' }}>
                {p ? p.name : 'sold out'}
                {p ? <span style={{ color: '#8A959E', fontSize: 10 }}> {handTag(p)} · {p.type === 'B' ? p.pos : p.type}{p.pos2 ? <span style={{ color: '#5FA88F' }}>/{p.pos2}</span> : null} · {p.type === 'B' ? p.pow + '/' + p.con + '/' + p.onb : p.pow + '/' + p.ctl + '/' + p.chg}{p.type === 'B' ? <span style={{ color: '#5FA88F' }}> · {p.spd}/{p.def}/{p.arm}</span> : null}</span> : null}
              </span>
              <button onClick={() => onBuy(s.star)} disabled={!afford}
                style={{ ...BTN, padding: '4px 10px', fontSize: 11, fontWeight: 700,
                  background: afford ? '#F2A93B' : '#2A3138', color: afford ? '#111417' : '#5b6870', border: 'none' }}>
                {s.price}
              </button>
            </div>
          );
        })}
        <div style={{ ...LABEL, fontSize: 9, margin: '10px 0 2px' }}>Packs — 2 random players</div>
        {PACKS.map(pk => {
          const afford = L.tokens >= pk.price;
          return (
            <div key={pk.key} style={{ display: 'flex', alignItems: 'center', padding: '6px 2px', borderTop: '1px solid #22282e' }}>
              <span style={{ flex: 1, fontSize: 12 }}>
                <span style={{ color: pk.color, fontWeight: 700 }}>{pk.name}</span>
              </span>
              <button onClick={() => onPack(pk.key)} disabled={!afford}
                style={{ ...BTN, padding: '4px 10px', fontSize: 11, fontWeight: 700,
                  background: afford ? pk.color : '#2A3138', color: afford ? '#111417' : '#5b6870', border: 'none' }}>
                {pk.price}
              </button>
            </div>
          );
        })}
      </div>

      {/* roster */}
      <div style={CARD}>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
          <div style={{ ...LABEL }}>Your club</div>
          <span style={{ ...MONO, fontSize: 11, color: '#8A959E' }}>{starTotal}★ · {L.roster.length}/17</span>
        </div>
        {['B', 'SP', 'RP'].map(t => (
          <div key={t}>
            <div style={{ ...LABEL, fontSize: 9, margin: '6px 0 2px' }}>{t === 'B' ? 'Batters' : t === 'SP' ? 'Starters' : 'Relief'}</div>
            {L.roster.filter(id => byId[id] && byId[id].type === t).map(id => {
              const p = byId[id];
              const c = (L.fatigue && L.fatigue[id]) || 0;
              const h = (L.heat && L.heat[id]) || 0;
              return (
                <div key={id} style={{ display: 'flex', alignItems: 'center', fontSize: 11, padding: '2px 0' }}>
                  <span style={{ width: 24, ...MONO, color: '#5b6870' }}>{p.stars}★</span>
                  <span style={{ width: 44, ...MONO, color: '#5b6870' }}>{p.type === 'B' ? (p.pos + (p.pos2 ? '/' + p.pos2 : '')) : ''}</span>
                  <span style={{ flex: 1, color: p.generic ? '#5b6870' : '#EDEDE3' }}>{p.name}</span>
                  <span style={{ ...MONO, fontSize: 10, color: '#8A959E', marginRight: 6 }}>
                    {p.type === 'B' ? p.pow + '/' + p.con + '/' + p.onb : p.pow + '/' + p.ctl + '/' + p.chg}
                  </span>
                  {p.type === 'B'
                    ? <span style={{ ...MONO, fontSize: 10, width: 20, textAlign: 'right', color: h > 0 ? '#5FA88F' : h < 0 ? '#E63946' : '#5b6870' }}>{h ? (h > 0 ? '+' + h : h) : '—'}</span>
                    : <span style={{ ...MONO, fontSize: 10, width: 20, textAlign: 'right', color: c === 0 ? '#5FA88F' : c >= 4 ? '#E63946' : '#F2A93B' }}>{c || '—'}</span>}
                </div>
              );
            })}
          </div>
        ))}
      </div>

      {/* ALL-TIME STATS for your club across the whole run */}
      {L.allTime && (L.allTime.games || 0) > 0 && (
        <div style={CARD}>
          <div onClick={() => setShowStats(s => !s)} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', cursor: 'pointer' }}>
            <div style={{ ...LABEL }}>All-time stats · {L.allTime.games} game{L.allTime.games === 1 ? '' : 's'}</div>
            <span style={{ ...MONO, fontSize: 11, color: '#8A959E' }}>{showStats ? '▲ hide' : '▼ show'}</span>
          </div>
          {showStats && (() => {
            const batIds = Object.keys(L.allTime.bat).filter(id => byId[id]).sort((a, b) => (L.allTime.bat[b].h || 0) - (L.allTime.bat[a].h || 0));
            const pitIds = Object.keys(L.allTime.pit).filter(id => byId[id]).sort((a, b) => (L.allTime.pit[b].k || 0) - (L.allTime.pit[a].k || 0));
            return (
              <div style={{ overflowX: 'auto', marginTop: 8 }}>
                <table style={{ ...MONO, fontSize: 10.5, width: '100%', borderCollapse: 'collapse' }}>
                  <thead><tr style={{ color: '#8A959E', textAlign: 'right' }}>
                    <th style={{ textAlign: 'left' }}>Batter</th><th>G</th><th>AB</th><th>R</th><th>H</th><th>2B</th><th>3B</th><th>HR</th><th>RBI</th><th>BB</th><th>K</th><th>SB</th><th>AVG</th><th>OBP</th>
                  </tr></thead>
                  <tbody>
                    {batIds.map(id => {
                      const l = L.allTime.bat[id];
                      const avg = l.ab > 0 ? (l.h / l.ab).toFixed(3).replace(/^0/, '') : '—';
                      const obp = l.pa > 0 ? (l.ob / l.pa).toFixed(3).replace(/^0/, '') : '—';
                      return (
                        <tr key={id} style={{ borderTop: '1px solid #22282e', textAlign: 'right' }}>
                          <td style={{ textAlign: 'left', color: '#C9D4DB' }}>{byId[id].name}</td>
                          <td>{l.g}</td><td style={{ color: '#EDEDE3' }}>{l.ab}</td><td>{l.r}</td>
                          <td style={{ color: '#EDEDE3' }}>{l.h}</td><td>{l.d2}</td><td>{l.d3}</td><td>{l.hr}</td>
                          <td>{l.rbi}</td><td>{l.bb}</td><td>{l.k}</td><td>{l.sb}</td>
                          <td style={{ color: '#8A959E' }}>{avg}</td><td style={{ color: '#8A959E' }}>{obp}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
                <table style={{ ...MONO, fontSize: 10.5, width: '100%', borderCollapse: 'collapse', marginTop: 8 }}>
                  <thead><tr style={{ color: '#8A959E', textAlign: 'right' }}>
                    <th style={{ textAlign: 'left' }}>Pitcher</th><th>G</th><th>IP</th><th>BF</th><th>R</th><th>K</th><th>K/9</th>
                  </tr></thead>
                  <tbody>
                    {pitIds.map(id => {
                      const l = L.allTime.pit[id];

function LadderCut({ L, onConfirm }) {
  const all = L.roster.concat(L.pending);

    const t = { B: [], SP: [], RP: [] };
    all.forEach(id => { const p = byId[id]; if (p) t[p.type].push(id); });

    const bats = t.B.sort((a, b) => byId[b].stars - byId[a].stars).slice(0, LADDER_ROSTER.B);

    const twoWayInBats = bats.filter(id => byId[id].twP).length;
    out.push(...t.SP.sort((a, b) => byId[b].stars - byId[a].stars).slice(0, Math.max(0, LADDER_ROSTER.SP - twoWayInBats)));
    out.push(...t.RP.sort((a, b) => byId[b].stars - byId[a].stars).slice(0, LADDER_ROSTER.RP));

  const twoWayCount = keep.filter(id => byId[id] && byId[id].twP).length;
  const legal = counts.B === LADDER_ROSTER.B && counts.SP === LADDER_ROSTER.SP && counts.RP === LADDER_ROSTER.RP;

          <span style={{ color: '#5b6870' }}> · </span>

          <div style={{ ...LABEL, marginBottom: 4 }}>{t === 'B' ? 'Batters' : t === 'SP' ? 'Starters' : 'Relief'} — keep {t === 'SP' ? Math.max(0, LADDER_ROSTER.SP - twoWayCount) : LADDER_ROSTER[t]}{t === 'SP' && twoWayCount > 0 ? ' (two-way arm fills the rest)' : ''}</div>
          {all.filter(id => byId[id] && byId[id].type === t)
              .sort((a, b) => byId[b].stars - byId[a].stars)
              .map(id => {
            const p = byId[id];

            return (
              <div key={id} onClick={() => toggle(id)} style={{ display: 'flex', alignItems: 'center', padding: '6px 4px', borderBottom: '1px solid #22282e', cursor: 'pointer', background: on ? '#2A3138' : 'transparent', borderRadius: 5 }}>

                </span>
                <span style={{ ...MONO, fontSize: 10, color: '#8A959E' }}>
                  {p.type === 'B' ? p.pow + '/' + p.con + '/' + p.onb : p.pow + '/' + p.ctl + '/' + p.chg}
                </span>
                {(() => {
